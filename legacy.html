ta-action=\"演示：载入输入的网址\">前往\u003c/button>\u003cbutton class=\"btn\" data-action=\"演示：重新载入网页\">↻\u003c/button>\u003c/div>\u003cdiv style=\"margin-top:20px;border:1px solid #e0e5ee;border-radius:12px;overflow:hidden;background:#fff;color:#172333\">\u003cdiv style=\"padding:18px 26px;border-bottom:1px solid #e9edf4\">\u003cstrong>Northstar / Design\u003c/strong>\u003cspan style=\"float:right;color:#7c8797\">Foundations　Components\u003c/span>\u003c/div>\u003cdiv style=\"padding:42px 28px\">\u003cspan style=\"color:#6271d9;font-size:12px\">DESIGN GUIDELINES\u003c/span>\u003ch2 style=\"font-size:36px;letter-spacing:-.035em\">Less friction.\u003cbr>More focus.\u003c/h2>\u003cp style=\"color:#748093;max-width:400px\">A calm, consistent interface helps every idea move forward.\u003c/p>\u003cdiv style=\"display:flex;gap:10px;margin-top:30px\">\u003cspan style=\"padding:12px 18px;background:#172333;color:white;border-radius:9px\">Explore components ↗\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdetails class=\"card\" style=\"margin-top:20px\">\u003csummary>网页无法嵌入时\u003c/summary>\u003cp class=\"subtle\">有些站点限制在面板内打开。保留地址与失败说明，并提供外部打开入口。\u003c/p>\u003cbutton class=\"btn\" data-action=\"演示：在外部浏览器打开当前网址\">在浏览器打开 ↗\u003c/button>\u003c/details>"},{"id":"terminal","title":"交互终端","category":"资源","description":"真实终端视觉、Shell 选择和连接状态；原型按钮不执行命令。","body":"\u003cdiv class=\"cardhead\">\u003cdiv>\u003ch1 class=\"page-heading\">终端\u003c/h1>\u003cp class=\"subtle\">northstar · /workspace/northstar\u003c/p>\u003c/div>\u003cdiv>\u003cselect class=\"field\" aria-label=\"Shell\">\u003coption>bash\u003c/option>\u003coption>zsh\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cdiv class=\"cardhead\" style=\"margin:16px 0\">\u003cdiv>\u003cspan class=\"pill\">● bash · 已连接\u003c/span> \u003cspan class=\"subtle\">可输入\u003c/span>\u003c/div>\u003cbutton class=\"btn\" data-action=\"演示：新建终端标签\">＋ 新终端\u003c/button>\u003c/div>\u003cpre class=\"code\" style=\"background:#121820;color:#d6dfeb;min-height:370px;line-height:1.9;padding:24px\">\u003ccode>\u003cspan style=\"color:#77d9bd\">dev@northstar\u003c/span> \u003cspan style=\"color:#8ba7f7\">~/northstar\u003c/span>\n$ pnpm run check\n\n\u003cspan style=\"color:#a0abba\">&gt; northstar@1.0.0 check\n&gt; tsc --noEmit\u003c/span>\n\n\u003cspan style=\"color:#77d9bd\">✓ Type checking passed\u003c/span>\n\n$ git status --short\n \u003cspan style=\"color:#eccb8e\">M\u003c/span> src/components/Button.tsx\n \u003cspan style=\"color:#eccb8e\">M\u003c/span> src/components/Button.module.css\n\n\u003cspan style=\"color:#77d9bd\">dev@northstar\u003c/span> \u003cspan style=\"color:#8ba7f7\">~/northstar\u003c/span>\n$ \u003cspan style=\"background:#c9d8ee;color:#121820\"> \u003c/span>\u003c/code>\u003c/pre>\u003cdiv class=\"cardhead\">\u003cspan class=\"subtle\">收起面板保持进程；关闭终端会请求结束进程。\u003c/span>\u003cbutton class=\"btn danger\" data-action=\"演示：确认关闭当前终端\">关闭终端\u003c/button>\u003c/div>\u003cdetails class=\"card\" style=\"margin-top:16px\">\u003csummary>连接中断状态\u003c/summary>\u003cp>当前屏幕保留，等待手动重新连接。\u003c/p>\u003cbutton class=\"btn primary\" data-action=\"演示：重新连接终端\">重新连接\u003c/button>\u003cbutton class=\"btn\" data-action=\"演示：请求终端输入控制权\">接管输入\u003c/button>\u003c/details>"},{"id":"split","title":"会话与资源分栏","category":"资源","description":"同时可见的聊天、代码与终端；窄屏以页签访问同一内容。","body":"\u003cdiv class=\"cardhead\">\u003cdiv>\u003ch1 class=\"page-heading\">一边讨论，一边检查\u003c/h1>\u003cp class=\"subtle\">桌面分栏 · 聊天 / 文件 / 终端\u003c/p>\u003c/div>\u003cbutton class=\"btn\" data-action=\"演示：资源面板全屏\">全屏资源 ↗\u003c/button>\u003c/div>\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:24px;align-items:start\">\u003csection class=\"card\" style=\"min-height:450px\">\u003cdiv class=\"cardhead\">\u003cstrong>会话\u003c/strong>\u003cspan class=\"badge\">当前轮次\u003c/span>\u003c/div>\u003carticle class=\"message user\">\u003cp>焦点样式需要怎么改？\u003c/p>\u003c/article>\u003carticle class=\"message assistant\">\u003cdiv class=\"prose\">\u003cp>使用主题中的品牌色作为外圈，同时保留 2px 的偏移，避免覆盖按钮边缘。\u003c/p>\u003cbutton class=\"pill\" data-route=\"diff\">Button.module.css · +6 −2\u003c/button>\u003cp>右侧已打开对应代码与检查结果。\u003c/p>\u003c/div>\u003c/article>\u003cdiv class=\"composer\">\u003ctextarea class=\"field\" rows=\"2\" placeholder=\"继续讨论…\">\u003c/textarea>\u003cbutton class=\"btn primary\" data-action=\"演示：发送分栏中的消息\">↑\u003c/button>\u003c/div>\u003c/section>\u003csection class=\"stack\">\u003cdiv class=\"card\">\u003cdiv class=\"cardhead\">\u003cstrong>⌘ Button.module.css\u003c/strong>\u003cbutton class=\"btn\" data-route=\"preview-document\">↗\u003c/button>\u003c/div>\u003cpre class=\"code\" style=\"line-height:1.9\">\u003ccode>12  .button:focus-visible {\n13    outline: 2px solid\n14      var(--brand);\n15    outline-offset: 2px;\n16  }\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"cardhead\">\u003cstrong>⌘ bash\u003c/strong>\u003cspan class=\"badge\">已连接\u003c/span>\u003c/div>\u003cpre class=\"code\" style=\"background:#121820;color:#cdd8e8;min-height:150px\">\u003ccode>$ pnpm test -- Button\n\n✓ keyboard focus\n✓ disabled state\n✓ loading state\n\n3 passed  ▍\u003c/code>\u003c/pre>\u003c/div>\u003c/section>\u003c/div>\u003cp class=\"subtle\">手机上改为“会话 / 文件 / 终端”切换，保持同一页签身份与运行状态。\u003c/p>"},{"id":"deliverables","title":"交付文件","category":"资源","description":"清楚展示可打开的成果文件、用途和相关变更。","body":"\u003cdiv class=\"cardhead\">\u003cdiv>\u003ch1 class=\"page-heading\">这次完成的成果\u003c/h1>\u003cp class=\"subtle\">设计系统迁移 · 演示交付清单\u003c/p>\u003c/div>\u003cspan class=\"badge\">3 个文件\u003c/span>\u003c/div>\u003cdiv class=\"stack\" style=\"margin-top:24px\">\u003carticle class=\"card\">\u003cdiv class=\"list-row\">\u003cspan class=\"avatar\">≡\u003c/span>\u003cdiv class=\"row-main\">\u003ch3>组件规范.md\u003c/h3>\u003cp class=\"subtle\">按钮层级、表单规则与交互状态说明\u003c/p>\u003c/div>\u003cbutton class=\"btn primary\" data-route=\"preview-document\">打开\u003c/button>\u003c/div>\u003cp class=\"row-desc\">docs / 组件规范.md · Markdown · 8.4 KB\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003cdiv class=\"list-row\">\u003cspan class=\"avatar\">▧\u003c/span>\u003cdiv class=\"row-main\">\u003ch3>交互状态总览.png\u003c/h3>\u003cp class=\"subtle\">用于设计评审的状态对照\u003c/p>\u003c/div>\u003cbutton class=\"btn\" data-route=\"preview-image\">预览\u003c/button>\u003c/div>\u003c/article>\u003carticle class=\"card\">\u003cdiv class=\"list-row\">\u003cspan class=\"avatar\">⌘\u003c/span>\u003cdiv class=\"row-main\">\u003ch3>组件改动\u003c/h3>\u003cp class=\"subtle\">Button.tsx 与 Button.module.css\u003c/p>\u003c/div>\u003cbutton class=\"btn\" data-route=\"diff\">审阅差异\u003c/button>\u003c/div>\u003c/article>\u003c/div>\u003cp class=\"subtle\">交付卡片指向实际文件；文件移动或不可访问时应给出明确恢复提示。\u003c/p>"},{"id":"diff","title":"审阅文件变更","category":"资源","description":"以行级增删展示修改，并保留文件路径和上下文。","body":"\u003cdiv class=\"cardhead\">\u003cdiv>\u003ch1 class=\"page-heading\">Button.module.css\u003c/h1>\u003cp class=\"subtle\">src / components · 工作区变更\u003c/p>\u003c/div>\u003cdiv>\u003cspan class=\"badge\">+6\u003c/span> \u003cspan class=\"badge\">−2\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"cardhead\" style=\"margin:18px 0\">\u003cspan class=\"pill\">统一差异\u003c/span>\u003cbutton class=\"btn\" data-route=\"preview-document\">查看完整文件 ↗\u003c/button>\u003c/div>\u003cdiv class=\"card\" style=\"padding:0;overflow:auto\">\u003cpre class=\"code\" style=\"margin:0;padding:0;min-width:460px;line-height:1.9;background:transparent\">\u003ccode>\u003cspan style=\"display:block;padding:10px 18px;background:#7185b51a\">@@ -8,7 +8,11 @@ .button\u003c/span>\u003cspan style=\"display:block;padding:0 18px\">  8    border-radius: 10px;\u003c/span>\u003cspan style=\"display:block;padding:0 18px;background:#df5b671b;color:#bd4253\">− 9    background: #5365ff;\u003c/span>\u003cspan style=\"display:block;padding:0 18px;background:#35a87c1c;color:#248562\">+ 9    background: var(--brand);\u003c/span>\u003cspan style=\"display:block;padding:0 18px\"> 10  }\u003c/span>\u003cspan style=\"display:block;padding:0 18px\"> 11\u003c/span>\u003cspan style=\"display:block;padding:0 18px;background:#35a87c1c;color:#248562\">+12  .button:focus-visible {\u003c/span>\u003cspan style=\"display:block;padding:0 18px;background:#35a87c1c;color:#248562\">+13    outline: 2px solid var(--brand);\u003c/span>\u003cspan style=\"display:block;padding:0 18px;background:#35a87c1c;color:#248562\">+14    outline-offset: 2px;\u003c/span>\u003cspan style=\"display:block;padding:0 18px;background:#35a87c1c;color:#248562\">+15  }\u003c/span>\u003cspan style=\"display:block;padding:0 18px\"> 16\u003c/span>\u003cspan style=\"display:block;padding:0 18px;background:#df5b671b;color:#bd4253\">−17  .disabled { opacity: .3; }\u003c/span>\u003cspan style=\"display:block;padding:0 18px;background:#35a87c1c;color:#248562\">+17  .disabled { opacity: .45; }\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"card\" style=\"margin-top:20px\">\u003clabel class=\"form-row\">向 Agent 提出修改意见\u003ctextarea class=\"field\" rows=\"2\" placeholder=\"例如：请再检查暗色主题下的焦点对比度\">\u003c/textarea>\u003c/label>\u003cbutton class=\"btn primary\" data-action=\"演示：将变更反馈加入会话草稿\">带回会话讨论 →\u003c/button>\u003c/div>"},{"id":"feedback","title":"消息反馈","category":"交互","description":"针对某条回复选择问题类型、填写说明，提交前明确范围。","body":"\u003cdiv style=\"max-width:740px;margin:20px auto\">\u003ch1 class=\"page-heading\">这条回复哪里可以更好？\u003c/h1>\u003cp class=\"subtle\">反馈关联当前这条助手消息。你的描述能帮助定位问题。\u003c/p>\u003cdiv class=\"card\">\u003cstrong>反馈对象\u003c/strong>\u003cblockquote class=\"subtle\">“我检查了现有组件，建议先统一层级、间距和交互状态……”\u003c/blockquote>\u003c/div>\u003cfieldset class=\"card\" style=\"margin-top:20px\">\u003clegend>选择问题类型\u003c/legend>\u003clabel class=\"list-row\">\u003cinput type=\"radio\" name=\"feedback-type\" checked> 没有遵循要求\u003c/label>\u003clabel class=\"list-row\">\u003cinput type=\"radio\" name=\"feedback-type\"> 内容不准确\u003c/label>\u003clabel class=\"list-row\">\u003cinput type=\"radio\" name=\"feedback-type\"> 表达不清楚\u003c/label>\u003clabel class=\"list-row\">\u003cinput type=\"radio\" name=\"feedback-type\"> 其他问题\u003c/label>\u003c/fieldset>\u003clabel class=\"form-row\" style=\"margin:20px 0\">补充说明\u003ctextarea class=\"field\" rows=\"4\" placeholder=\"描述你期待的结果，以及回复遗漏了什么\">\u003c/textarea>\u003c/label>\u003cdiv class=\"cardhead\">\u003cbutton class=\"btn\" data-route=\"chat\">取消\u003c/button>\u003cbutton class=\"btn primary\" data-action=\"演示：消息反馈已提交\">提交反馈\u003c/button>\u003c/div>\u003cp class=\"subtle\">当前为本地演示，不会上传任何会话内容。\u003c/p>\u003c/div>"},{"id":"voice","title":"语音输入","category":"输入","description":"录音、转写、草稿冲突恢复与明确的发送状态，演示中不访问麦克风。","body":"\u003cdiv class=\"cardhead\">\u003cdiv>\u003ch1 class=\"page-heading\">说出你的想法\u003c/h1>\u003cp class=\"subtle\">语音输入原型 · 不访问真实麦克风\u003c/p>\u003c/div>\u003cbutton class=\"btn\" data-action=\"演示：选择麦克风设备\">默认麦克风 ⌄\u003c/button>\u003c/div>\u003cdiv class=\"card\" style=\"text-align:center;padding:32px;max-width:760px;margin:24px auto\">\u003cspan class=\"badge\">● 正在录音 · 00:08\u003c/span>\u003cdiv style=\"height:100px;display:flex;justify-content:center;align-items:center;gap:7px;margin:18px 0\">\u003ci style=\"height:20px;width:5px;background:#7d85d8;border-radius:5px\">\u003c/i>\u003ci style=\"height:36px;width:5px;background:#7d85d8;border-radius:5px\">\u003c/i>\u003ci style=\"height:58px;width:5px;background:#7d85d8;border-radius:5px\">\u003c/i>\u003ci style=\"height:82px;width:5px;background:#7d85d8;border-radius:5px\">\u003c/i>\u003ci style=\"height:48px;width:5px;background:#7d85d8;border-radius:5px\">\u003c/i>\u003ci style=\"height:70px;width:5px;background:#7d85d8;border-radius:5px\">\u003c/i>\u003ci style=\"height:40px;width:5px;background:#7d85d8;border-radius:5px\">\u003c/i>\u003ci style=\"height:24px;width:5px;background:#7d85d8;border-radius:5px\">\u003c/i>\u003c/div>\u003cp>正在听，完成后可先检查文字。\u003c/p>\u003cbutton class=\"btn\" data-action=\"演示：取消录音\">取消\u003c/button> \u003cbutton class=\"btn primary\" data-action=\"演示：结束录音并开始转写\">■ 结束录音\u003c/button>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"cardhead\">\u003cstrong>转写结果\u003c/strong>\u003cspan class=\"badge\">等待插入\u003c/span>\u003c/div>\u003cp>把按钮的焦点样式也检查一下，尤其是暗色模式。\u003c/p>\u003cp class=\"subtle\">如果录音期间草稿已改变，保留结果，由你决定插入到新的光标位置。\u003c/p>\u003cdiv>\u003cbutton class=\"btn primary\" data-action=\"演示：将转写结果插入当前草稿\">插入草稿\u003c/button> \u003cbutton class=\"btn\" data-action=\"演示：保留转写文本，不发送\">保留文字\u003c/button>\u003c/div>\u003c/div>\u003cp class=\"subtle\">草稿插入、开始发送、Host 接纳分别显示；触发发送调用不直接显示“发送成功”。\u003c/p>"},{"id":"directory","title":"选择工作目录","category":"导航","description":"目录逐级浏览与确认，不把工作区移除等同于删除文件。","body":"\u003cdiv style=\"max-width:780px;margin:16px auto\">\u003ch1 class=\"page-heading\">在哪里开始工作？\u003c/h1>\u003cp class=\"subtle\">选择一个目录作为工作区，会话将在该目录的上下文中进行。\u003c/p>\u003cdiv class=\"card\">\u003clabel class=\"form-row\">目录路径\u003cinput class=\"field\" value=\"/workspace\" aria-label=\"工作目录路径\">\u003c/label>\u003cdiv class=\"divider\">\u003c/div>\u003cbutton class=\"list-row\" data-action=\"演示：浏览northstar目录\" style=\"width:100%;text-align:left\">\u003cspan class=\"avatar\">▱\u003c/span>\u003cspan class=\"row-main\">\u003cstrong>northstar\u003c/strong>\u003cspan class=\"row-desc\">项目目录\u003c/span>\u003c/span>\u003cspan>›\u003c/span>\u003c/button>\u003cbutton class=\"list-row\" data-action=\"演示：浏览research目录\" style=\"width:100%;text-align:left\">\u003cspan class=\"avatar\">▱\u003c/span>\u003cspan class=\"row-main\">\u003cstrong>research\u003c/strong>\u003cspan class=\"row-desc\">资料与笔记\u003c/span>\u003c/span>\u003cspan>›\u003c/span>\u003c/button>\u003cbutton class=\"list-row\" data-action=\"演示：浏览playground目录\" style=\"width:100%;text-align:left\">\u003cspan class=\"avatar\">▱\u003c/span>\u003cspan class=\"row-main\">\u003cstrong>playground\u003c/strong>\u003cspan class=\"row-desc\">实验项目\u003c/span>\u003c/span>\u003cspan>›\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"cardhead\" style=\"margin-top:20px\">\u003cbutton class=\"btn\" data-route=\"home\">取消\u003c/button>\u003cbutton class=\"btn primary\" data-action=\"演示：连接选中的工作目录\">使用此目录 →\u003c/button>\u003c/div>\u003cdetails style=\"margin-top:24px\">\u003csummary>已有工作区\u003c/summary>\u003cdiv class=\"list-row\">\u003cspan class=\"row-main\">northstar\u003cspan class=\"row-desc\">/workspace/northstar\u003c/span>\u003c/span>\u003cbutton class=\"btn\" data-route=\"home\">打开\u003c/button>\u003c/div>\u003c/details>\u003c/div>"},{"id":"navigation","title":"导航抽屉","category":"导航","description":"手机端的工作区与会话导航；行操作仅在长按后出现。","scene":"drawer","body":"\u003cdiv class=\"cardhead\">\u003ch1 class=\"page-heading\">你的工作空间\u003c/h1>\u003cbutton class=\"btn\" data-route=\"home\">＋ 新会话\u003c/button>\u003c/div>\u003cdiv class=\"field-grid\" style=\"margin-top:24px\">\u003csection class=\"card\">\u003cbutton class=\"field btn\" data-route=\"search\" style=\"text-align:left;width:100%\">⌕ 搜索会话 \u003ckbd>⌘ K\u003c/kbd>\u003c/button>\u003cdiv class=\"cardhead\" style=\"margin-top:20px\">\u003cstrong>▾ Northstar\u003c/strong>\u003cspan class=\"subtle\">3\u003c/span>\u003c/div>\u003cbutton class=\"list-row\" data-route=\"chat\" style=\"width:100%;text-align:left\">\u003cspan class=\"row-main\">\u003cstrong>设计系统迁移\u003c/strong>\u003cspan class=\"row-desc\">● 正在运行 · 今天\u003c/span>\u003c/span>\u003cspan class=\"badge\">置顶\u003c/span>\u003c/button>\u003cbutton class=\"list-row\" data-route=\"chat\" style=\"width:100%;text-align:left\">\u003cspan class=\"row-main\">手机端交互规范\u003cspan class=\"row-desc\">昨天\u003c/span>\u003c/span>\u003c/button>\u003cbutton class=\"list-row\" data-route=\"chat\" style=\"width:100%;text-align:left\">\u003cspan class=\"row-main\">组件状态检查\u003cspan class=\"row-desc\">10 月 18 日\u003c/span>\u003c/span>\u003c/button>\u003cdiv class=\"divider\">\u003c/div>\u003cdiv class=\"list-row\">\u003cstrong>▸ Research\u003c/strong>\u003c/div>\u003cdiv class=\"cardhead\" style=\"margin-top:24px\">\u003cbutton class=\"btn\" data-route=\"directory\">＋ 工作区\u003c/button>\u003cbutton class=\"btn\" data-route=\"settings-general\">设置\u003c/button>\u003c/div>\u003c/section>\u003csection class=\"card\">\u003ch3>留出阅读空间\u003c/h3>\u003cp class=\"subtle\">手机抽屉覆盖会话但保留当前位置；进入会话后收起。桌面可以保持侧栏常驻。\u003c/p>\u003cdiv class=\"divider\">\u003c/div>\u003cp>行内没有三个常驻操作图标。\u003c/p>\u003cbutton class=\"btn\" data-route=\"session-menu\">查看长按后的菜单 →\u003c/button>\u003c/section>\u003c/div>"},{"id":"search","title":"搜索会话","category":"导航","description":"标题匹配与内容片段同时展示，空结果提供修改关键词入口。","scene":"search","body":"\u003cdiv style=\"max-width:800px;margin:20px auto\">\u003cdiv class=\"cardhead\">\u003ch1 class=\"page-heading\">找到之前的讨论\u003c/h1>\u003cbutton class=\"btn\" data-route=\"navigation\">返回导航\u003c/button>\u003c/div>\u003cinput class=\"field\" type=\"search\" value=\"焦点\" aria-label=\"搜索会话\" style=\"margin-top:18px\">\u003cdiv class=\"cardhead\" style=\"margin:20px 0\">\u003cspan class=\"subtle\">3 条结果 · 标题与内容\u003c/span>\u003cselect class=\"field\" aria-label=\"归档过滤\">\u003coption>活跃会话\u003c/option>\u003coption>全部会话\u003c/option>\u003coption>仅归档\u003c/option>\u003c/select>\u003c/div>\u003cbutton class=\"card\" data-route=\"chat\" style=\"display:block;text-align:left;width:100%;margin-bottom:12px\">\u003cdiv class=\"cardhead\">\u003cstrong>按钮焦点与键盘规范\u003c/strong>\u003cspan class=\"subtle\">今天\u003c/span>\u003c/div>\u003cp class=\"row-desc\">Northstar · 标题匹配\u003c/p>\u003cp>统一 \u003cmark>焦点\u003c/mark> 外圈、键盘移动与禁用状态。\u003c/p>\u003c/button>\u003cbutton class=\"card\" data-route=\"chat\" style=\"display:block;text-align:left;width:100%;margin-bottom:12px\">\u003cdiv class=\"cardhead\">\u003cstrong>设计系统迁移\u003c/strong>\u003cspan class=\"subtle\">昨天\u003c/span>\u003c/div>\u003cp class=\"row-desc\">Northstar · 内容匹配\u003c/p>\u003cp>“…弹窗关闭后应将 \u003cmark>焦点\u003c/mark> 归还给触发按钮…”\u003c/p>\u003c/button>\u003cbutton class=\"card\" data-route=\"chat\" style=\"display:block;text-align:left;width:100%\">\u003cdiv class=\"cardhead\">\u003cstrong>手机端交互检查\u003c/strong>\u003cspan class=\"subtle\">10 月 18 日\u003c/span>\u003c/div>\u003cp class=\"row-desc\">Research · 内容匹配\u003c/p>\u003cp>“…中文输入法组合期间避免错误移动 \u003cmark>焦点\u003c/mark> …”\u003c/p>\u003c/button>\u003cp class=\"subtle\">进入结果会打开对应会话；是否支持定位具体事件取决于当前能力。\u003c/p>\u003c/div>"},{"id":"session-menu","title":"会话长按菜单","category":"导航","description":"与目标行相邻的小菜单，不占用底部整张面板。","scene":"session-menu","body":"\u003cdiv style=\"max-width:680px;margin:24px auto\">\u003ch1 class=\"page-heading\">长按这一行，处理这条会话\u003c/h1>\u003cp class=\"subtle\">手机菜单贴近目标行显示，松手后继续选择操作。\u003c/p>\u003csection class=\"card\" style=\"position:relative;min-height:390px\">\u003cdiv class=\"list-row\">\u003cstrong>▾ Northstar\u003c/strong>\u003c/div>\u003cdiv class=\"list-row\">\u003cspan class=\"row-main\">设计系统迁移\u003cspan class=\"row-desc\">今天 · 目标会话\u003c/span>\u003c/span>\u003cspan class=\"badge\">已长按\u003c/span>\u003c/div>\u003cdiv class=\"card\" style=\"width:min(250px,90%);margin:4px 0 20px auto;padding:8px;box-shadow:0 16px 45px #14233324\">\u003cbutton class=\"list-row btn\" style=\"width:100%;text-align:left\" data-action=\"演示：置顶会话\">⌖ 置顶\u003c/button>\u003cbutton class=\"list-row btn\" style=\"width:100%;text-align:left\" data-action=\"演示：打开会话重命名\">✎ 重命名\u003c/button>\u003cbutton class=\"list-row btn\" style=\"width:100%;text-align:left\" data-action=\"演示：创建分叉会话\">⑂ 分叉\u003c/button>\u003cbutton class=\"list-row btn\" style=\"width:100%;text-align:left\" data-action=\"演示：归档前检查运行状态\">▣ 归档\u003c/button>\u003cdiv class=\"divider\">\u003c/div>\u003cbutton class=\"list-row btn\" style=\"width:100%;text-align:left\" data-action=\"演示：复制Session ID\">⧉ 复制 Session ID\u003c/button>\u003c/div>\u003cdiv class=\"list-row\">\u003cspan class=\"row-main\">手机端交互规范\u003c/span>\u003c/div>\u003c/section>\u003cdetails class=\"card\" style=\"margin-top:20px\">\u003csummary>归档时仍有活动\u003c/summary>\u003cp>这条会话仍在运行。可以取消，或明确选择停止活动并归档。\u003c/p>\u003cbutton class=\"btn\" data-action=\"演示：取消归档\">取消\u003c/button> \u003cbutton class=\"btn danger\" data-action=\"演示：明确确认停止活动并归档\">停止活动并归档\u003c/button>\u003c/details>\u003c/div>"},{"id":"components","title":"基础组件","category":"设计系统","description":"可直接交互的按钮、表单、选择、开关、折叠与信息状态。","body":"\u003ch1 class=\"page-heading\">同一套细节，贯穿每个页面\u003c/h1>\u003cp class=\"subtle\">按钮、表单与反馈统一层级，保持清楚的焦点和可读标签。\u003c/p>\u003cdiv class=\"field-grid\" style=\"margin-top:24px\">\u003csection class=\"card stack\">\u003ch3>动作与强调\u003c/h3>\u003cdiv>\u003cbutton class=\"btn primary\" data-action=\"演示：主要操作\">保存更改\u003c/button> \u003cbutton class=\"btn\" data-action=\"演示：次要操作\">取消\u003c/button>\u003c/div>\u003cdiv>\u003cbutton class=\"btn danger\" data-action=\"演示：危险操作需明确确认\">停止运行\u003c/button> \u003cbutton class=\"btn\" disabled>不可用\u003c/button>\u003c/div>\u003cdiv>\u003cspan class=\"badge\">已完成\u003c/span> \u003cspan class=\"badge\">进行中\u003c/span> \u003cspan class=\"pill\">只读\u003c/span>\u003c/div>\u003cdetails>\u003csummary>展开更多说明\u003c/summary>\u003cp class=\"subtle\">键盘可以聚焦触发器，展开状态可被辅助技术识别。\u003c/p>\u003c/details>\u003c/section>\u003csection class=\"card stack\">\u003ch3>表单与验证\u003c/h3>\u003clabel class=\"form-row\">项目名称\u003cinput class=\"field\" placeholder=\"为项目起个名字\" value=\"Northstar\">\u003c/label>\u003clabel class=\"form-row\">展示方式\u003cselect class=\"field\">\u003coption>按工作区分组\u003c/option>\u003coption>工作区树\u003c/option>\u003coption>平铺会话\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"list-row\">\u003cinput type=\"checkbox\" class=\"toggle\" checked> 跟随系统主题\u003c/label>\u003clabel class=\"form-row\">必填名称\u003cinput class=\"field\" aria-invalid=\"true\" placeholder=\"请输入名称\">\u003cspan style=\"color:#c15464;font-size:12px\">名称不能为空。\u003c/span>\u003c/label>\u003c/section>\u003c/div>\u003csection class=\"card\" style=\"margin-top:20px\">\u003cdiv class=\"cardhead\">\u003ch3>信息密度\u003c/h3>\u003cbutton class=\"btn\" data-action=\"演示：显示轻量提示\">显示提示\u003c/button>\u003c/div>\u003cdiv class=\"list-row\">\u003cspan class=\"avatar\">N\u003c/span>\u003cdiv class=\"row-main\">\u003cstrong class=\"row-title\">主要标题与清晰层级\u003c/strong>\u003cspan class=\"row-desc\">辅助描述解释用途，不挤占操作区域。\u003c/span>\u003c/div>\u003cbutton class=\"btn\" data-route=\"states\">查看状态 →\u003c/button>\u003c/div>\u003c/section>"},{"id":"states","title":"状态与恢复","category":"设计系统","description":"用互斥的折叠场景浏览空态、加载、错误、断线与不可用。","body":"\u003ch1 class=\"page-heading\">每一种状态都有下一步\u003c/h1>\u003cp class=\"subtle\">下列是独立场景，请展开查看；实际页面不会把全部状态同时叠加。\u003c/p>\u003cdetails class=\"card\" open style=\"margin-top:20px\">\u003csummary>\u003cstrong>空工作区\u003c/strong>\u003c/summary>\u003cdiv class=\"empty-state\" style=\"padding:35px;text-align:center\">\u003cspan style=\"font-size:38px\">◌\u003c/span>\u003ch3>这里还没有会话\u003c/h3>\u003cp class=\"subtle\">从一个问题开始，结果会保留在这个工作区。\u003c/p>\u003cbutton class=\"btn primary\" data-route=\"home\">创建会话\u003c/button>\u003c/div>\u003c/details>\u003cdetails class=\"card\">\u003csummary>\u003cstrong>正在加载\u003c/strong>\u003c/summary>\u003cdiv style=\"padding:24px\">\u003cdiv style=\"height:15px;width:55%;border-radius:7px;background:#8f9bb522;margin-bottom:16px\">\u003c/div>\u003cdiv style=\"height:12px;width:90%;border-radius:6px;background:#8f9bb51a;margin-bottom:12px\">\u003c/div>\u003cdiv style=\"height:12px;width:75%;border-radius:6px;background:#8f9bb51a\">\u003c/div>\u003cp class=\"subtle\" role=\"status\">正在获取会话…\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"card\">\u003csummary>\u003cstrong>载入失败\u003c/strong>\u003c/summary>\u003cdiv class=\"empty-state\">\u003ch3>暂时无法加载\u003c/h3>\u003cp class=\"subtle\">已保留当前草稿，请恢复连接后再试。\u003c/p>\u003cbutton class=\"btn primary\" data-action=\"演示：重试载入\">重新加载\u003c/button>\u003c/div>\u003c/details>\u003cdetails class=\"card\">\u003csummary>\u003cstrong>连接中断\u003c/strong>\u003c/summary>\u003cp>页面内容保留，操作暂时不可用。\u003c/p>\u003cbutton class=\"btn\" data-action=\"演示：重新连接Host\">重新连接\u003c/button>\u003c/details>\u003cdetails class=\"card\">\u003csummary>\u003cstrong>当前能力不可用\u003c/strong>\u003c/summary>\u003cp class=\"subtle\">这个面板所需的插件尚未启用。保留入口说明，不显示可执行的假功能。\u003c/p>\u003cbutton class=\"btn\" data-route=\"plugins\">查看插件\u003c/button>\u003c/details>\u003cdetails class=\"card\">\u003csummary>\u003cstrong>搜索无结果\u003c/strong>\u003c/summary>\u003cdiv class=\"empty-state\">\u003ch3>没有找到相关会话\u003c/h3>\u003cp class=\"subtle\">尝试更短的关键词，或将范围改为全部会话。\u003c/p>\u003cbutton class=\"btn\" data-route=\"search\">修改搜索\u003c/button>\u003c/div>\u003c/details>"},{"id":"settings-general","title":"通用设置","category":"设置","description":"外观、字号、语言与发送习惯。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>让 Harness 适合你的习惯\u003c/h1>\u003cp class='subtle'>交互演示 · 选择只保留在本页，不修改当前配置。\u003c/p>\u003c/div>\u003cspan class='badge'>通用\u003c/span>\u003c/header>\u003csection class='card stack'>\u003cdiv class='cardhead'>\u003ch2>外观与阅读\u003c/h2>\u003cspan class='pill'>跟随设备\u003c/span>\u003c/div>\u003cdiv class='field-grid'>\u003clabel class='field'>主题\u003cselect>\u003coption>跟随系统\u003c/option>\u003coption>浅色\u003c/option>\u003coption>深色\u003c/option>\u003c/select>\u003c/label>\u003clabel class='field'>界面语言\u003cselect>\u003coption>简体中文\u003c/option>\u003coption>English\u003c/option>\u003c/select>\u003c/label>\u003clabel class='field'>正文字号\u003cselect>\u003coption>标准 · 15 px\u003c/option>\u003coption>较大 · 17 px\u003c/option>\u003coption>大号 · 19 px\u003c/option>\u003c/select>\u003c/label>\u003clabel class='field'>终端字号\u003cselect>\u003coption>14 px\u003c/option>\u003coption>16 px\u003c/option>\u003coption>18 px\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003clabel class='toggle'>\u003cinput type='checkbox' checked>减少界面动效\u003c/label>\u003c/section>\u003csection class='card stack'>\u003ch2>输入与会话\u003c/h2>\u003clabel class='field'>Agent 忙碌时按 Enter\u003cselect>\u003coption>排队，等待下一回合\u003c/option>\u003coption>插话，影响当前回合\u003c/option>\u003c/select>\u003c/label>\u003cp class='subtle'>Shift + Enter 换行。中文输入法选词不会触发发送。\u003c/p>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn' data-route='shortcuts'>查看快捷键\u003c/button>\u003cbutton type='button' class='btn primary' data-action='保存通用设置（演示）'>保存更改\u003c/button>\u003c/div>\u003c/section>"},{"id":"settings-account","title":"账户与凭据","category":"设置","description":"账户、额度和凭据状态，区分应用登录与 Web 访问。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>账户与凭据\u003c/h1>\u003cp class='subtle'>演示身份与额度，不读取真实账户或密钥。\u003c/p>\u003c/div>\u003cspan class='badge'>账户\u003c/span>\u003c/header>\u003csection class='card'>\u003cdiv class='list-row'>\u003cdiv class='avatar'>D\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>演示账户\u003c/div>\u003cdiv class='row-desc'>已连接 DeepSeek · 示例状态\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-action='查看账户资料（演示）'>账户资料\u003c/button>\u003c/div>\u003cdiv class='metric-grid'>\u003cdiv>\u003cspan class='subtle'>可用余额\u003c/span>\u003ch2>¥ 24.80\u003c/h2>\u003c/div>\u003cdiv>\u003cspan class='subtle'>本月用量\u003c/span>\u003ch2>1.28 M\u003c/h2>\u003c/div>\u003cdiv>\u003cspan class='subtle'>统计口径\u003c/span>\u003ch2>演示数据\u003c/h2>\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-action='刷新账户状态（演示）'>刷新状态\u003c/button>\u003c/section>\u003csection class='card stack'>\u003ch2>访问凭据\u003c/h2>\u003clabel class='field'>API Key\u003cinput type='password' value='••••' autocomplete='off'>\u003c/label>\u003cp class='subtle'>已保存的密钥只显示状态，不回读原值。新凭据需用户明确保存。\u003c/p>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn primary' data-action='保存凭据（演示，不发送）'>保存凭据\u003c/button>\u003cbutton type='button' class='btn danger' data-action='清除凭据确认（演示）'>清除凭据\u003c/button>\u003c/div>\u003c/section>\u003csection class='card'>\u003ch2>退出账户\u003c/h2>\u003cp>退出 DeepSeek 账户不会自动注销当前 Web 访问凭据。\u003c/p>\u003cbutton type='button' class='btn danger' data-action='退出账户确认（演示）'>退出账户\u003c/button>\u003c/section>"},{"id":"settings-models","title":"模型提供商","category":"设置","description":"提供商连接、默认模型与加载错误入口。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>连接你需要的模型\u003c/h1>\u003cp class='subtle'>提供商和模型均为示例，不发出网络请求。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn primary' data-route='provider-settings'>添加提供商\u003c/button>\u003c/header>\u003csection class='card stack'>\u003clabel class='field'>查找提供商\u003cinput type='search' placeholder='搜索名称或连接方式'>\u003c/label>\u003cdiv class='list-row'>\u003cdiv class='avatar'>DS\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>DeepSeek 账户\u003c/div>\u003cdiv class='row-desc'>使用账户连接 · 默认提供商\u003c/div>\u003c/div>\u003cspan class='badge'>可用\u003c/span>\u003cbutton type='button' class='btn' data-route='provider-settings'>配置\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>API\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>兼容 API\u003c/div>\u003cdiv class='row-desc'>自定义 Endpoint · 3 个示例模型\u003c/div>\u003c/div>\u003cspan class='pill'>已配置\u003c/span>\u003cbutton type='button' class='btn' data-route='provider-settings'>管理\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>!\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>本地提供商\u003c/div>\u003cdiv class='row-desc'>目录加载失败 · 检查服务地址后重试\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-action='重试加载模型目录（演示）'>重试\u003c/button>\u003c/div>\u003c/section>\u003csection class='card stack'>\u003ch2>默认选择\u003c/h2>\u003clabel class='field'>新会话默认模型\u003cselect>\u003coption>跟随当前可用默认模型\u003c/option>\u003coption>示例模型 A\u003c/option>\u003coption>示例模型 B\u003c/option>\u003c/select>\u003c/label>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn' data-route='models'>预览模型选择器\u003c/button>\u003cbutton type='button' class='btn primary' data-action='保存默认模型（演示）'>保存默认值\u003c/button>\u003c/div>\u003c/section>"},{"id":"provider-settings","title":"提供商配置","category":"设置","description":"连接地址、密钥、模型清单及配置冲突。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>兼容 API\u003c/h1>\u003cp class='subtle'>配置表单演示 · 不测试连接、不发送密钥。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='settings-models'>返回提供商\u003c/button>\u003c/header>\u003csection class='card stack'>\u003ch2>连接\u003c/h2>\u003cdiv class='field-grid'>\u003clabel class='field'>显示名称\u003cinput value='工作用 API'>\u003c/label>\u003clabel class='field'>连接方式\u003cselect>\u003coption>兼容 API\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003clabel class='field'>Endpoint\u003cinput type='url' value='https://api.example.invalid/v1'>\u003c/label>\u003clabel class='field'>API Key\u003cinput type='password' value='••••' autocomplete='off'>\u003c/label>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn' data-action='测试连接（演示，不联网）'>测试连接\u003c/button>\u003cspan class='subtle'>最近状态：尚未测试\u003c/span>\u003c/div>\u003c/section>\u003csection class='card stack'>\u003ch2>模型目录\u003c/h2>\u003cdiv class='table-wrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>模型 ID\u003c/th>\u003cth>显示名称\u003c/th>\u003cth>状态\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>example-model-a\u003c/td>\u003ctd>示例模型 A\u003c/td>\u003ctd>可选\u003c/td>\u003c/tr>\u003ctr>\u003ctd>example-model-b\u003c/td>\u003ctd>示例模型 B\u003c/td>\u003ctd>可选\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class='subtle'>复杂配置保留文档入口；页面不冒充完整 schema 编辑器。\u003c/p>\u003cdetails>\u003csummary>高级配置预览\u003c/summary>\u003cpre class='code'>provider: compatible\nendpoint: https://api.example.invalid/v1\ncredential: [已隐藏]\u003c/pre>\u003c/details>\u003c/section>\u003csection class='card stack'>\u003cspan class='badge'>冲突状态示例\u003c/span>\u003cp>配置已在另一个页面更新。请重新载入后核对你的修改。\u003c/p>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn' data-action='重新载入提供商配置（演示）'>重新载入\u003c/button>\u003cbutton type='button' class='btn primary' data-action='保存提供商配置（演示）'>保存配置\u003c/button>\u003c/div>\u003c/section>"},{"id":"settings-plugins","title":"内置插件设置","category":"设置","description":"内置模块配置导航与 Loader 清单。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>内置插件\u003c/h1>\u003cp class='subtle'>配置与运行清单演示。安装扩展请前往独立的插件管理页。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='plugins'>插件管理\u003c/button>\u003c/header>\u003csection class='card stack'>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>Agent 循环\u003c/div>\u003cdiv class='row-desc'>工具并发与执行偏好\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-route='settings-agent-loop'>设置\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>Shell 执行\u003c/div>\u003cdiv class='row-desc'>当前平台的执行器配置\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-route='settings-shell'>设置\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>子代理\u003c/div>\u003cdiv class='row-desc'>子代理模型与默认行为\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-route='settings-subagent'>设置\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>Web 搜索\u003c/div>\u003cdiv class='row-desc'>密钥、Endpoint 和搜索预算\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-route='settings-web-search'>设置\u003c/button>\u003c/div>\u003c/section>\u003csection class='card'>\u003cdiv class='cardhead'>\u003ch2>运行清单\u003c/h2>\u003cspan class='pill'>只读示例\u003c/span>\u003c/div>\u003cdiv class='table-wrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>模块\u003c/th>\u003cth>状态\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>会话控制器\u003c/td>\u003ctd>active\u003c/td>\u003ctd>提供会话生命周期\u003c/td>\u003c/tr>\u003ctr>\u003ctd>实验语音输入\u003c/td>\u003ctd>inactive\u003c/td>\u003ctd>示例中由本地语音扩展替代\u003c/td>\u003c/tr>\u003ctr>\u003ctd>可选转换器\u003c/td>\u003ctd>pending\u003c/td>\u003ctd>等待依赖\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class='subtle'>表格不是当前运行 profile 的检测结果。\u003c/p>\u003c/section>"},{"id":"settings-agent-loop","title":"Agent 循环设置","category":"设置","description":"工具并发上限与保存反馈。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>Agent 循环\u003c/h1>\u003cp class='subtle'>配置演示 · 不更改运行中的 Agent。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='settings-plugins'>内置插件\u003c/button>\u003c/header>\u003csection class='card stack'>\u003ch2>工具并发\u003c/h2>\u003clabel class='field'>并行执行上限\u003cinput type='number' min='1' max='32' value='4'>\u003c/label>\u003cp>控制单个 Agent 可并行处理的工具数量。实际允许范围由当前 Host schema 决定。\u003c/p>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>当前草稿\u003c/div>\u003cdiv class='row-desc'>4 个并行工具 · 尚未保存\u003c/div>\u003c/div>\u003cspan class='badge'>未保存\u003c/span>\u003c/div>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn' data-action='恢复循环设置默认值（演示）'>恢复默认\u003c/button>\u003cbutton type='button' class='btn primary' data-action='保存工具并发上限（演示）'>保存更改\u003c/button>\u003c/div>\u003c/section>\u003csection class='card'>\u003ch2>配置结果\u003c/h2>\u003cp class='subtle'>保存成功后显示生效结果；失败时保留输入和具体原因，不自动扩大权限或增加不存在的循环控制项。\u003c/p>\u003cbutton type='button' class='btn' data-action='查看循环配置错误状态（演示）'>查看错误状态\u003c/button>\u003c/section>"},{"id":"settings-shell","title":"Shell 执行设置","category":"设置","description":"平台配置与 Agent Shell、交互终端的区别。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>Shell 执行\u003c/h1>\u003cp class='subtle'>当前展示 Linux 配置草案，不执行命令。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='settings-plugins'>内置插件\u003c/button>\u003c/header>\u003csection class='card stack'>\u003cdiv class='cardhead'>\u003ch2>执行环境\u003c/h2>\u003cspan class='pill'>Linux · 示例\u003c/span>\u003c/div>\u003clabel class='field'>Shell 配置文档\u003ctextarea rows='6' spellcheck='false'># 具体字段由平台 schema 提供\n# 本原型只展示编辑与校验流程\n# 不向 Host 写入此文本\u003c/textarea>\u003c/label>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn' data-action='校验Shell配置（演示）'>校验草稿\u003c/button>\u003cbutton type='button' class='btn primary' data-action='保存Shell配置（演示）'>保存配置\u003c/button>\u003c/div>\u003c/section>\u003csection class='card stack'>\u003ch2>两种 Shell，各自独立\u003c/h2>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>Agent Shell 工具\u003c/div>\u003cdiv class='row-desc'>按 Agent 权限与审批流程运行。\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-route='permissions'>权限设置\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>用户交互终端\u003c/div>\u003cdiv class='row-desc'>用户直接操作的独立进程，不等于工具输出。\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-route='files'>查看资源面板\u003c/button>\u003c/div>\u003c/section>"},{"id":"settings-subagent","title":"子代理设置","category":"设置","description":"默认子代理模型与能力边界。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>子代理\u003c/h1>\u003cp class='subtle'>设置演示 · 不创建子会话或更改模型。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='settings-plugins'>内置插件\u003c/button>\u003c/header>\u003csection class='card stack'>\u003ch2>默认模型\u003c/h2>\u003clabel class='field'>子代理模型\u003cselect>\u003coption>使用已配置的默认路线\u003c/option>\u003coption>示例模型 A\u003c/option>\u003coption>示例模型 B\u003c/option>\u003c/select>\u003c/label>\u003cp class='subtle'>选项应来自当前提供商能力，不能把示例模型当已部署模型。\u003c/p>\u003cbutton type='button' class='btn primary' data-action='保存子代理默认模型（演示）'>保存默认值\u003c/button>\u003c/section>\u003csection class='card stack'>\u003ch2>会话类型\u003c/h2>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>一次性子会话\u003c/div>\u003cdiv class='row-desc'>可查看历史，输入区只读。\u003c/div>\u003c/div>\u003cspan class='badge'>one-shot\u003c/span>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>可继续子会话\u003c/div>\u003cdiv class='row-desc'>按父会话可用性决定输入；父离线时运行中的 Stop 仍可用。\u003c/div>\u003c/div>\u003cspan class='pill'>continuable\u003c/span>\u003c/div>\u003cbutton type='button' class='btn' data-route='team'>预览团队界面\u003c/button>\u003c/section>"},{"id":"settings-web-search","title":"Web 搜索设置","category":"设置","description":"搜索提供商凭据、Endpoint 与预算。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>Web 搜索\u003c/h1>\u003cp class='subtle'>表单演示，不检索网络，不保存密钥。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='settings-plugins'>内置插件\u003c/button>\u003c/header>\u003csection class='card stack'>\u003clabel class='field'>搜索服务 Endpoint\u003cinput type='url' value='https://search.example.invalid'>\u003c/label>\u003clabel class='field'>API Key\u003cinput type='password' value='••••' autocomplete='off'>\u003c/label>\u003clabel class='field'>搜索预算\u003cinput type='number' min='1' value='5'>\u003c/label>\u003cp class='subtle'>只配置当前 schema 提供的 key、Endpoint 与预算，不伪造其他搜索选项。\u003c/p>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn' data-action='校验搜索配置（演示）'>校验配置\u003c/button>\u003cbutton type='button' class='btn primary' data-action='保存搜索配置（演示）'>保存更改\u003c/button>\u003c/div>\u003c/section>\u003csection class='card'>\u003cdiv class='cardhead'>\u003ch2>连接状态\u003c/h2>\u003cspan class='badge'>尚未检测\u003c/span>\u003c/div>\u003cp>未配置凭据时，调用搜索应显示可操作的错误，而不是空搜索结果。\u003c/p>\u003cbutton type='button' class='btn' data-action='预览搜索凭据缺失状态（演示）'>预览缺少凭据\u003c/button>\u003c/section>"},{"id":"settings-log","title":"会话日志","category":"设置","description":"会话日志导出、提交反馈与敏感内容提示。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>会话日志\u003c/h1>\u003cp class='subtle'>预览日志流程，不读取或上传真实日志。\u003c/p>\u003c/div>\u003cspan class='badge'>诊断\u003c/span>\u003c/header>\u003csection class='card stack'>\u003clabel class='field'>目标会话\u003cselect>\u003coption>当前演示会话\u003c/option>\u003coption>UI 设计讨论 · 示例\u003c/option>\u003c/select>\u003c/label>\u003cdiv class='metric-grid'>\u003cdiv>\u003cspan class='subtle'>日志范围\u003c/span>\u003ch2>完整会话\u003c/h2>\u003c/div>\u003cdiv>\u003cspan class='subtle'>预览内容\u003c/span>\u003ch2>已隐藏\u003c/h2>\u003c/div>\u003c/div>\u003cp>日志可能包含对话、工具参数和文件路径。上传与下载应分别明确操作。\u003c/p>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn primary' data-action='导出会话日志（演示，不下载）'>导出日志\u003c/button>\u003cbutton type='button' class='btn' data-action='打开日志提交确认（演示，不上传）'>提交诊断\u003c/button>\u003c/div>\u003c/section>\u003csection class='card stack'>\u003ch2>提交说明\u003c/h2>\u003clabel class='field'>问题描述\u003ctextarea rows='3' placeholder='描述触发步骤、实际结果和预期结果'>\u003c/textarea>\u003c/label>\u003clabel class='toggle'>\u003cinput type='checkbox'>我已查看提交范围\u003c/label>\u003cbutton type='button' class='btn' data-action='预览日志上传进度（演示）'>预览提交进度\u003c/button>\u003cp class='subtle'>本页任何操作都不会产生上传。\u003c/p>\u003c/section>"},{"id":"shortcuts","title":"快捷键","category":"设置","description":"按当前平台组织的输入、导航和面板快捷键。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>少一点切换，多一点专注\u003c/h1>\u003cp class='subtle'>快捷键布局演示，实际组合由当前平台目录提供。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='settings-general'>通用设置\u003c/button>\u003c/header>\u003csection class='card stack'>\u003clabel class='field'>查找操作\u003cinput type='search' placeholder='搜索发送、搜索会话、面板…'>\u003c/label>\u003cdiv class='table-wrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>操作\u003c/th>\u003cth>按键示例\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>发送\u003c/td>\u003ctd>\u003ckbd>Enter\u003c/kbd>\u003c/td>\u003ctd>忙碌时遵循排队/插话偏好\u003c/td>\u003c/tr>\u003ctr>\u003ctd>换行\u003c/td>\u003ctd>\u003ckbd>Shift\u003c/kbd> + \u003ckbd>Enter\u003c/kbd>\u003c/td>\u003ctd>保留输入法选词\u003c/td>\u003c/tr>\u003ctr>\u003ctd>加速提交\u003c/td>\u003ctd>\u003ckbd>Ctrl / ⌘\u003c/kbd> + \u003ckbd>Enter\u003c/kbd>\u003c/td>\u003ctd>含义由提交策略决定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>关闭当前菜单\u003c/td>\u003ctd>\u003ckbd>Esc\u003c/kbd>\u003c/td>\u003ctd>先关闭上层菜单\u003c/td>\u003c/tr>\u003ctr>\u003ctd>搜索会话\u003c/td>\u003ctd>跟随平台\u003c/td>\u003ctd>显示已注册的有效组合\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection class='card'>\u003ch2>手机操作\u003c/h2>\u003cp>会话行仅长按出现就近小卡片；不常显更多、归档、置顶三个图标。外接键盘仍保留焦点操作。\u003c/p>\u003cbutton type='button' class='btn' data-route='chat'>回到会话\u003c/button>\u003c/section>"},{"id":"models","title":"选择模型","category":"会话控制","description":"模型目录、推理强度和提供商失败状态。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>这次想用哪个模型？\u003c/h1>\u003cp class='subtle'>目录示例，选择不会改变真实会话。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='settings-models'>管理提供商\u003c/button>\u003c/header>\u003csection class='card stack'>\u003clabel class='field'>搜索模型\u003cinput type='search' placeholder='搜索名称或提供商'>\u003c/label>\u003cspan class='subtle'>账户模型\u003c/span>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>示例模型 A\u003c/div>\u003cdiv class='row-desc'>当前路线 · 支持推理强度\u003c/div>\u003c/div>\u003cspan class='badge'>当前\u003c/span>\u003cbutton type='button' class='btn' data-action='选择示例模型A（演示）'>选择\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>示例模型 B\u003c/div>\u003cdiv class='row-desc'>兼容 API · 使用该适配器公开的能力\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-action='选择示例模型B（演示）'>选择\u003c/button>\u003c/div>\u003clabel class='field'>推理强度\u003cselect>\u003coption>默认\u003c/option>\u003coption>中等（示例能力）\u003c/option>\u003coption>较高（示例能力）\u003c/option>\u003c/select>\u003c/label>\u003c/section>\u003csection class='card'>\u003ch2>部分目录未加载\u003c/h2>\u003cp>本地提供商暂不可用。其他已加载目录仍可选。\u003c/p>\u003cbutton type='button' class='btn' data-action='重试模型目录（演示）'>重试此提供商\u003c/button>\u003cp class='subtle'>寻址到子代理的会话不提供模型切换，避免显示无效操作。\u003c/p>\u003c/section>"},{"id":"permissions","title":"权限模式","category":"会话控制","description":"当前会话权限、默认值与用户确认。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>决定 Agent 可以做什么\u003c/h1>\u003cp class='subtle'>权限界面演示，任何选择都不会放宽真实权限。\u003c/p>\u003c/div>\u003cspan class='badge'>仅用户决定\u003c/span>\u003c/header>\u003csection class='card stack'>\u003clabel class='field'>作用范围\u003cselect>\u003coption>当前会话\u003c/option>\u003coption>新会话默认值\u003c/option>\u003c/select>\u003c/label>\u003clabel class='field'>权限预设\u003cselect>\u003coption>当前目录提供的预设（示例）\u003c/option>\u003coption>只读（示例）\u003c/option>\u003coption>工作区写入（示例）\u003c/option>\u003coption>完全访问（需确认，示例）\u003c/option>\u003c/select>\u003c/label>\u003cp class='subtle'>实际选项来自 Host catalog；当前权限与默认设置分开保存。\u003c/p>\u003cbutton type='button' class='btn primary' data-action='预览权限选择（演示，不改权限）'>应用选择\u003c/button>\u003c/section>\u003csection class='card stack'>\u003ch2>扩大权限前\u003c/h2>\u003cp>界面展示实际影响，并等待用户确认。语音“发送”、模型工具和推荐选项不会代替用户授权。\u003c/p>\u003clabel class='toggle'>\u003cinput type='checkbox'>我理解这次权限变化的影响（演示）\u003c/label>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn' data-action='取消权限确认（演示）'>取消\u003c/button>\u003cbutton type='button' class='btn danger' data-action='确认扩大权限（仅演示，不执行）'>确认更改\u003c/button>\u003c/div>\u003c/section>"},{"id":"presets","title":"Agent 预设","category":"会话控制","description":"预设选择、默认值与 Creator 入口。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>为工作选一个起点\u003c/h1>\u003cp class='subtle'>演示预设，不新建或修改真实会话。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn primary' data-route='chat'>通过 Creator 创建\u003c/button>\u003c/header>\u003csection class='card stack'>\u003clabel class='field'>查找预设\u003cinput type='search' placeholder='搜索名称或用途'>\u003c/label>\u003cdiv class='list-row'>\u003cdiv class='avatar'>C\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>编码协作 · 示例\u003c/div>\u003cdiv class='row-desc'>代码阅读、修改与验证\u003c/div>\u003c/div>\u003cspan class='badge'>默认\u003c/span>\u003cbutton type='button' class='btn' data-route='preset-detail'>查看\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>R\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>研究助手 · 示例\u003c/div>\u003cdiv class='row-desc'>资料检索与证据整理\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-action='选择研究预设（演示）'>用于空白会话\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>＋\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>Creator\u003c/div>\u003cdiv class='row-desc'>通过对话构建插件或预设，不是直接编辑 YAML。\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-route='chat'>进入对话\u003c/button>\u003c/div>\u003c/section>\u003csection class='card'>\u003ch2>已有会话保持自己的配置\u003c/h2>\u003cp>修改默认值影响新会话；复用空白会话时必须核对目标身份。\u003c/p>\u003cbutton type='button' class='btn' data-action='设为默认预设（演示）'>设为默认\u003c/button>\u003c/section>"},{"id":"preset-detail","title":"预设详情","category":"会话控制","description":"只读预设内容与创建流程。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>编码协作\u003c/h1>\u003cp class='subtle'>只读内容示例 · 非当前预设配置。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='presets'>全部预设\u003c/button>\u003c/header>\u003csection class='card stack'>\u003cdiv class='cardhead'>\u003ch2>适合的工作\u003c/h2>\u003cspan class='badge'>示例\u003c/span>\u003c/div>\u003cp>阅读代码、明确修改范围、实现并验证真实行为。\u003c/p>\u003cdiv class='form-row'>\u003cspan class='pill'>代码\u003c/span>\u003cspan class='pill'>工具协作\u003c/span>\u003cspan class='pill'>验证\u003c/span>\u003c/div>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn primary' data-action='在空白会话使用预设（演示）'>用于空白会话\u003c/button>\u003cbutton type='button' class='btn' data-action='设置默认预设（演示）'>设为默认\u003c/button>\u003c/div>\u003c/section>\u003csection class='card'>\u003ch2>组合内容 · 只读预览\u003c/h2>\u003cpre class='code'># 这里只展示结构，不是可部署配置\nname: 编码协作\npurpose: 阅读、实现与验证\nplugins: [由安装包提供]\npermissions: [沿用用户配置]\u003c/pre>\u003cp class='subtle'>实际内容来自已安装 bundle，页面不拼接假模板覆写配置。\u003c/p>\u003c/section>\u003csection class='card'>\u003ch2>想调整这个预设？\u003c/h2>\u003cp>将目标带到 Creator 会话中，形成可审查的修改。\u003c/p>\u003cbutton type='button' class='btn' data-route='chat'>进入 Creator 讨论\u003c/button>\u003c/section>"},{"id":"plugins","title":"插件管理","category":"插件","description":"发现、安装、配置与启用状态。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>扩展你的工作台\u003c/h1>\u003cp class='subtle'>插件列表为设计演示，不读取或切换当前 profile。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn primary' data-route='plugin-install'>安装插件\u003c/button>\u003c/header>\u003csection class='card stack'>\u003cdiv class='cardhead'>\u003ch2>发现与已安装\u003c/h2>\u003cbutton type='button' class='btn' data-route='settings-plugins'>内置插件设置\u003c/button>\u003c/div>\u003clabel class='field'>搜索插件\u003cinput type='search' placeholder='名称、用途或安装来源'>\u003c/label>\u003cdiv class='list-row'>\u003cdiv class='avatar'>UI\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>手机与 PC 工作台\u003c/div>\u003cdiv class='row-desc'>界面适配 · 本地 bundle 示例\u003c/div>\u003c/div>\u003cspan class='badge'>演示已启用\u003c/span>\u003cbutton type='button' class='btn' data-route='plugin-detail'>详情\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>声\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>持续语音输入\u003c/div>\u003cdiv class='row-desc'>听写、设备与准备设置\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-route='voice-settings'>配置\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>燧\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>燧火工作台\u003c/div>\u003cdiv class='row-desc'>项目、素材和受控生成\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-route='suihuo'>打开\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>＋\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>更多可选扩展\u003c/div>\u003cdiv class='row-desc'>能力由实际安装包和运行时决定\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-action='浏览扩展目录（演示）'>发现\u003c/button>\u003c/div>\u003c/section>"},{"id":"plugin-detail","title":"插件详情","category":"插件","description":"Bundle 来源、组件、配置、生效与移除。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>手机与 PC 工作台\u003c/h1>\u003cp class='subtle'>详情演示 · 不是当前部署或验收结论。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='plugins'>返回插件\u003c/button>\u003c/header>\u003csection class='card stack'>\u003cdiv class='cardhead'>\u003ch2>本地扩展\u003c/h2>\u003cspan class='badge'>演示状态\u003c/span>\u003c/div>\u003cdiv class='field-grid'>\u003cdiv>\u003cspan class='subtle'>来源\u003c/span>\u003cp>本地目录 · 示例\u003c/p>\u003c/div>\u003cdiv>\u003cspan class='subtle'>版本\u003c/span>\u003cp>候选版本 · 未部署\u003c/p>\u003c/div>\u003c/div>\u003cp>通过受控视图适配保留业务注册项，完整功能仍需逐项验收。\u003c/p>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn primary' data-action='切换插件启用状态（仅演示）'>预览停用\u003c/button>\u003cbutton type='button' class='btn' data-action='查看更新计划（演示）'>查看更新\u003c/button>\u003cbutton type='button' class='btn danger' data-action='打开移除插件确认（演示）'>移除\u003c/button>\u003c/div>\u003c/section>\u003csection class='card'>\u003ch2>组件与生效结果\u003c/h2>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>视图适配组件\u003c/div>\u003cdiv class='row-desc'>等待对应 renderer 接口\u003c/div>\u003c/div>\u003cspan class='pill'>候选\u003c/span>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>需要重新加载页面\u003c/div>\u003cdiv class='row-desc'>请求完成与浏览器真正生效分开报告，不反复启停测试。\u003c/div>\u003c/div>\u003cspan class='badge'>结果示例\u003c/span>\u003c/div>\u003c/section>"},{"id":"plugin-install","title":"安装插件","category":"插件","description":"安装来源、预览、脚本许可与进度。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>添加一个扩展\u003c/h1>\u003cp class='subtle'>完整安装流程演示，不下载、不安装、不运行脚本。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='plugins'>取消并返回\u003c/button>\u003c/header>\u003csection class='card stack'>\u003clabel class='field'>安装来源\u003cselect>\u003coption>npm 包\u003c/option>\u003coption>本地目录\u003c/option>\u003c/select>\u003c/label>\u003clabel class='field'>包名或路径\u003cinput placeholder='@scope/package 或本地目录'>\u003c/label>\u003cbutton type='button' class='btn primary' data-action='预览安装清单（演示）'>预览安装\u003c/button>\u003c/section>\u003csection class='card stack'>\u003ch2>安装前核对\u003c/h2>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>版本与兼容性\u003c/div>\u003cdiv class='row-desc'>核实当前 Harness 版本与包要求\u003c/div>\u003c/div>\u003cspan class='pill'>待核实\u003c/span>\u003c/div>\u003clabel class='toggle'>\u003cinput type='checkbox'>允许本次清单明确列出的构建脚本（仅演示）\u003c/label>\u003cp class='subtle'>脚本许可与安装许可分开，不自动授予版本豁免。\u003c/p>\u003c/section>\u003csection class='card stack'>\u003cdiv class='cardhead'>\u003ch2>安装进度预览\u003c/h2>\u003cspan class='badge'>演示 64%\u003c/span>\u003c/div>\u003cprogress class='progress' value='64' max='100' aria-label='演示安装进度'>64%\u003c/progress>\u003cpre class='code'>准备依赖清单\n检查包版本\n等待用户确认…\u003c/pre>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn' data-action='取消安装（演示）'>取消安装\u003c/button>\u003cbutton type='button' class='btn' data-action='查看安装失败恢复（演示）'>查看失败恢复\u003c/button>\u003c/div>\u003c/section>"},{"id":"schedules","title":"自动化任务","category":"自动化","description":"任务清单、所属会话、时间与状态。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>把约定留给工作台\u003c/h1>\u003cp class='subtle'>任务、时间和状态均为演示数据。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn primary' data-route='schedule-create'>新建任务\u003c/button>\u003c/header>\u003csection class='card stack'>\u003cdiv class='field-grid'>\u003clabel class='field'>搜索任务\u003cinput type='search' placeholder='标题或关联会话'>\u003c/label>\u003clabel class='field'>显示范围\u003cselect>\u003coption>全部任务\u003c/option>\u003coption>当前会话\u003c/option>\u003coption>活跃任务\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>周\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>整理待办事项\u003c/div>\u003cdiv class='row-desc'>每周一 09:00 · UTC · 关联演示会话\u003c/div>\u003c/div>\u003cspan class='badge'>活跃\u003c/span>\u003cbutton type='button' class='btn' data-route='schedule-detail'>详情\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>1\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>检查发布结果\u003c/div>\u003cdiv class='row-desc'>一次性提醒 · UTC · 等待到期\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-route='schedule-detail'>详情\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>!\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>资料同步提醒\u003c/div>\u003cdiv class='row-desc'>最近一次投递失败 · 查看具体原因\u003c/div>\u003c/div>\u003cspan class='pill'>需处理\u003c/span>\u003cbutton type='button' class='btn' data-route='schedule-detail'>查看\u003c/button>\u003c/div>\u003c/section>"},{"id":"schedule-detail","title":"任务详情","category":"自动化","description":"任务时间表达、内容、会话与删除流程。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>整理待办事项\u003c/h1>\u003cp class='subtle'>任务详情演示，不创建或修改真实提醒。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='schedules'>全部任务\u003c/button>\u003c/header>\u003csection class='card stack'>\u003cdiv class='cardhead'>\u003ch2>下次约定\u003c/h2>\u003cspan class='badge'>活跃 · 示例\u003c/span>\u003c/div>\u003cdiv class='metric-grid'>\u003cdiv>\u003cspan class='subtle'>时间\u003c/span>\u003ch2>周一 09:00\u003c/h2>\u003c/div>\u003cdiv>\u003cspan class='subtle'>时区\u003c/span>\u003ch2>UTC\u003c/h2>\u003c/div>\u003c/div>\u003cdiv class='divider'>\u003c/div>\u003cp>提醒我检查项目待办，列出未完成事项与下一步。\u003c/p>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn' data-route='chat'>打开关联会话\u003c/button>\u003cbutton type='button' class='btn' data-action='在会话中讨论任务调整（演示）'>讨论调整\u003c/button>\u003c/div>\u003c/section>\u003csection class='card stack'>\u003ch2>任务记录\u003c/h2>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>已创建\u003c/div>\u003cdiv class='row-desc'>由关联会话中的明确请求生成 · 示例记录\u003c/div>\u003c/div>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>等待到期\u003c/div>\u003cdiv class='row-desc'>只有实际投递后才显示送达结果\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class='card'>\u003ch2>结束任务\u003c/h2>\u003cp>删除后不再安排后续提醒，不删除关联会话。\u003c/p>\u003cbutton type='button' class='btn danger' data-action='确认删除自动化任务（仅演示）'>删除任务\u003c/button>\u003c/section>"},{"id":"schedule-create","title":"拟定新任务","category":"自动化","description":"整理任务需求并转入真实会话创建入口。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>你想在什么时候被提醒？\u003c/h1>\u003cp class='subtle'>需求草稿演示。实际创建从会话开始，本页不直接写入调度器。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='schedules'>返回任务\u003c/button>\u003c/header>\u003csection class='card stack'>\u003clabel class='field'>任务名称\u003cinput placeholder='例如：整理项目待办'>\u003c/label>\u003clabel class='field'>要提醒的内容\u003ctextarea rows='4' placeholder='描述到期后希望收到的提醒'>\u003c/textarea>\u003c/label>\u003cdiv class='field-grid'>\u003clabel class='field'>时间意图\u003cselect>\u003coption>一次性提醒\u003c/option>\u003coption>固定间隔\u003c/option>\u003coption>每周\u003c/option>\u003c/select>\u003c/label>\u003clabel class='field'>时区\u003cselect>\u003coption>UTC\u003c/option>\u003coption>Asia/Shanghai\u003c/option>\u003coption>America/New_York\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003clabel class='field'>时间描述\u003cinput placeholder='例如：每周一 09:00，使用上方所选时区'>\u003c/label>\u003cp>先在会话中核对具体时间、时区和重复规则，再创建任务。不能把未注明时区的“明早”直接当成确定时刻。\u003c/p>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn' data-action='预览任务需求文本（演示）'>预览需求\u003c/button>\u003cbutton type='button' class='btn primary' data-route='chat'>进入会话创建\u003c/button>\u003c/div>\u003c/section>"},{"id":"goals","title":"持续目标","category":"自动化","description":"目标内容、自动继续轮次和用户控制。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>让目标持续向前\u003c/h1>\u003cp class='subtle'>目标控制演示，不启动自动继续。\u003c/p>\u003c/div>\u003cspan class='badge'>当前目标 · 示例\u003c/span>\u003c/header>\u003csection class='card stack'>\u003clabel class='field'>完成目标\u003ctextarea rows='4'>完成全部业务界面设计、真实功能连接，以及手机与 PC 验收。\u003c/textarea>\u003c/label>\u003cdiv class='field-grid'>\u003clabel class='field'>自动继续轮次上限\u003cinput type='number' min='1' value='12'>\u003c/label>\u003cdiv>\u003cspan class='subtle'>当前进展\u003c/span>\u003ch2>第 3 / 12 轮\u003c/h2>\u003c/div>\u003c/div>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn primary' data-action='保存目标修订（演示）'>保存修订\u003c/button>\u003cbutton type='button' class='btn' data-action='暂停持续目标（演示）'>暂停\u003c/button>\u003cbutton type='button' class='btn' data-action='恢复持续目标（演示）'>恢复\u003c/button>\u003c/div>\u003c/section>\u003csection class='card stack'>\u003ch2>进展与阻塞\u003c/h2>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>进行中\u003c/div>\u003cdiv class='row-desc'>规格与原型不等于真实行为已验收。\u003c/div>\u003c/div>\u003cspan class='pill'>演示\u003c/span>\u003c/div>\u003cp class='subtle'>目标修改采用版本核对。冲突时重新载入，不能静默覆盖。\u003c/p>\u003cbutton type='button' class='btn danger' data-action='确认清除目标（演示）'>清除目标\u003c/button>\u003c/section>"},{"id":"plan","title":"计划与审阅","category":"自动化","description":"计划内容、版本与用户批准或继续讨论。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>在动手之前，看清下一步\u003c/h1>\u003cp class='subtle'>计划审阅演示。此处不会批准任何真实请求。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='chat'>返回会话\u003c/button>\u003c/header>\u003csection class='card stack'>\u003cdiv class='cardhead'>\u003ch2>完整界面替换计划\u003c/h2>\u003cspan class='badge'>待审阅 · 示例\u003c/span>\u003c/div>\u003col>\u003cli>核实当前运行时、依赖和真实功能。\u003c/li>\u003cli>完成手机与 PC 页面及全部关键状态设计。\u003c/li>\u003cli>保留原业务注册项，逐域替换视图。\u003c/li>\u003cli>完成真实设备、权限与错误恢复验收。\u003c/li>\u003c/ol>\u003cp class='subtle'>计划不是执行沙箱。批准必须关联正在审阅的同一请求和文档版本。\u003c/p>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn' data-action='展开完整计划文档（演示）'>查看完整文档\u003c/button>\u003cbutton type='button' class='btn' data-route='chat'>继续讨论\u003c/button>\u003cbutton type='button' class='btn primary' data-action='批准计划（仅演示，不授权）'>批准这份计划\u003c/button>\u003c/div>\u003c/section>\u003csection class='card'>\u003ch2>关闭与过期\u003c/h2>\u003cp>具名计划卡片关闭后可能只是隐藏，不代表拒绝。请求已结算或撤销时，批准按钮应不可用。\u003c/p>\u003cbutton type='button' class='btn' data-action='预览计划已过期状态（演示）'>预览过期状态\u003c/button>\u003c/section>"},{"id":"jobs","title":"后台任务","category":"自动化","description":"运行任务、输出订阅和终止入口。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>后台正在发生什么\u003c/h1>\u003cp class='subtle'>任务和进度均为演示，不启动任何进程。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-action='刷新后台任务清单（演示）'>刷新\u003c/button>\u003c/header>\u003csection class='card stack'>\u003clabel class='field'>任务状态\u003cselect>\u003coption>全部\u003c/option>\u003coption>运行中\u003c/option>\u003coption>已结束\u003c/option>\u003c/select>\u003c/label>\u003cdiv class='list-row'>\u003cdiv class='avatar'>↻\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>构建候选界面\u003c/div>\u003cdiv class='row-desc'>bash · 所属演示会话 · 运行中\u003c/div>\u003c/div>\u003cspan class='badge'>running\u003c/span>\u003cbutton type='button' class='btn' data-route='job-detail'>查看输出\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>✓\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>检查设计矩阵\u003c/div>\u003cdiv class='row-desc'>结构检查完成 · 不是产品功能验收\u003c/div>\u003c/div>\u003cspan class='pill'>已结束\u003c/span>\u003cbutton type='button' class='btn' data-route='job-detail'>查看记录\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>!\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>加载预览资源\u003c/div>\u003cdiv class='row-desc'>已失败 · 查看具体错误后决定重试\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-route='job-detail'>查看原因\u003c/button>\u003c/div>\u003c/section>"},{"id":"job-detail","title":"后台任务输出","category":"自动化","description":"流式输出、状态、取消和会话关联。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>构建候选界面\u003c/h1>\u003cp class='subtle'>日志内容仅为示意，不是实际构建结果。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='jobs'>任务列表\u003c/button>\u003c/header>\u003csection class='card stack'>\u003cdiv class='cardhead'>\u003cspan class='badge'>运行中 · 演示\u003c/span>\u003cbutton type='button' class='btn danger' data-action='终止后台任务确认（仅演示）'>终止任务\u003c/button>\u003c/div>\u003cdiv class='field-grid'>\u003cdiv>\u003cspan class='subtle'>任务类型\u003c/span>\u003cp>bash\u003c/p>\u003c/div>\u003cdiv>\u003cspan class='subtle'>输出\u003c/span>\u003cp>stdout / stderr 合并显示\u003c/p>\u003c/div>\u003c/div>\u003cpre class='code' tabindex='0' aria-label='示例任务输出'>[示例输出]\n准备候选包…\n读取视图契约…\n等待编译结果…\n\n此日志不代表已经构建或测试通过。\u003c/pre>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn' data-action='复制示例任务输出（演示）'>复制输出\u003c/button>\u003cbutton type='button' class='btn' data-route='chat'>打开所属会话\u003c/button>\u003c/div>\u003c/section>\u003csection class='card'>\u003ch2>结束后的行为\u003c/h2>\u003cp>任务结束显示真实退出状态。取消不会自动重试，关闭输出视图不等于终止任务。\u003c/p>\u003cbutton type='button' class='btn' data-action='预览任务退出错误（演示）'>预览退出错误\u003c/button>\u003c/section>"},{"id":"context","title":"上下文洞察","category":"扩展","description":"上下文容量、来源与估算边界。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>看懂这次请求带了什么\u003c/h1>\u003cp class='subtle'>交互演示 · 示例分解，非当前会话统计；实际页由 dsh-context 等已启用插件提供。\u003c/p>\u003c/div>\u003cspan class='badge'>可选适配\u003c/span>\u003c/header>\u003csection class='card stack'>\u003cdiv class='metric-grid'>\u003cdiv>\u003cspan class='subtle'>使用量 · 示例\u003c/span>\u003ch2>32 k\u003c/h2>\u003c/div>\u003cdiv>\u003cspan class='subtle'>容量 · 示例\u003c/span>\u003ch2>128 k\u003c/h2>\u003c/div>\u003cdiv>\u003cspan class='subtle'>占用\u003c/span>\u003ch2>25%\u003c/h2>\u003c/div>\u003c/div>\u003cprogress class='progress' value='25' max='100' aria-label='示例上下文占用'>25%\u003c/progress>\u003cp class='subtle'>来源分解是估算，容量和实际投影缺失时不显示伪造百分比。\u003c/p>\u003c/section>\u003csection class='card'>\u003ch2>来源分解 · 示例\u003c/h2>\u003cdiv class='table-wrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>来源\u003c/th>\u003cth>估算量\u003c/th>\u003cth>解释\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>系统与工具\u003c/td>\u003ctd>12 k\u003c/td>\u003ctd>规则及工具定义\u003c/td>\u003c/tr>\u003ctr>\u003ctd>会话消息\u003c/td>\u003ctd>15 k\u003c/td>\u003ctd>模型请求中的历史\u003c/td>\u003c/tr>\u003ctr>\u003ctd>引用与附件\u003c/td>\u003ctd>5 k\u003c/td>\u003ctd>本次展开内容\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection class='card'>\u003ch2>三个不同的范围\u003c/h2>\u003cp>页面载入窗口、界面渲染窗口与模型上下文压缩不是一回事。不能把“首屏载入 12 条”写成模型只保留 12 条。\u003c/p>\u003cbutton type='button' class='btn' data-route='inspector'>查看请求检查器\u003c/button>\u003c/section>"},{"id":"team","title":"团队与子代理","category":"扩展","description":"成员状态、共享任务及父子会话。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>一起推进，同一份进度\u003c/h1>\u003cp class='subtle'>实验性团队界面演示，不创建成员或发送消息。\u003c/p>\u003c/div>\u003cspan class='badge'>可选插件\u003c/span>\u003c/header>\u003csection class='card stack'>\u003cdiv class='cardhead'>\u003ch2>成员\u003c/h2>\u003cspan class='pill'>3 位 · 示例\u003c/span>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>L\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>Lead\u003c/div>\u003cdiv class='row-desc'>协调与集成 · 当前回合运行中\u003c/div>\u003c/div>\u003cspan class='badge'>running\u003c/span>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>UI\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>界面开发\u003c/div>\u003cdiv class='row-desc'>导航与视图适配 · 可打开对应子会话\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-route='chat'>查看会话\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>QA\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>验证协作\u003c/div>\u003cdiv class='row-desc'>当前没有执行中的回合，不代表任务已完成\u003c/div>\u003c/div>\u003cspan class='pill'>inactive\u003c/span>\u003c/div>\u003c/section>\u003csection class='card'>\u003ch2>共享任务\u003c/h2>\u003cdiv class='table-wrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>任务\u003c/th>\u003cth>负责人\u003c/th>\u003cth>状态\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>导航视图\u003c/td>\u003ctd>界面开发\u003c/td>\u003ctd>进行中\u003c/td>\u003c/tr>\u003ctr>\u003ctd>输入规格\u003c/td>\u003ctd>规格协作\u003c/td>\u003ctd>待审查\u003c/td>\u003c/tr>\u003ctr>\u003ctd>手机验收\u003c/td>\u003ctd>未领取\u003c/td>\u003ctd>待开始\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class='subtle'>是否可见由 Lead Session 的真实团队投影与插件启用状态决定。\u003c/p>\u003c/section>"},{"id":"inspector","title":"检查器","category":"扩展","description":"请求、事件、工具关联与诊断状态。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>把行为和证据对上\u003c/h1>\u003cp class='subtle'>检查器布局演示，内容已虚构并隐藏敏感信息。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='chat'>返回会话\u003c/button>\u003c/header>\u003csection class='card stack'>\u003cdiv class='field-grid'>\u003clabel class='field'>检查对象\u003cselect>\u003coption>最近一次模型请求 · 示例\u003c/option>\u003coption>工具调用 · 示例\u003c/option>\u003coption>会话事件 · 示例\u003c/option>\u003c/select>\u003c/label>\u003clabel class='field'>筛选\u003cinput type='search' placeholder='事件类型、工具名称或字段'>\u003c/label>\u003c/div>\u003cdiv class='form-row'>\u003cspan class='badge'>只读\u003c/span>\u003cspan class='pill'>当前可见窗口\u003c/span>\u003c/div>\u003c/section>\u003csection class='card stack'>\u003cdetails open>\u003csummary>请求摘要\u003c/summary>\u003cpre class='code'>provider: [示例提供商]\nmodel: [示例模型]\nmessages: [已隐去正文]\ntools: [仅展示结构]\ncredentials: [不回读]\u003c/pre>\u003c/details>\u003cdetails>\u003csummary>事件与调用关联\u003c/summary>\u003cdiv class='table-wrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>事件\u003c/th>\u003cth>关联\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>turn/start\u003c/td>\u003ctd>示例轮次\u003c/td>\u003ctd>真实记录驱动\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tool/call\u003c/td>\u003ctd>示例调用\u003c/td>\u003ctd>参数与结果关联\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>\u003cdetails>\u003csummary>不可用状态\u003c/summary>\u003cp>检查器未启用或缺少投影时显示依赖指引，不把空窗口当已成功加载。\u003c/p>\u003c/details>\u003cbutton type='button' class='btn' data-action='复制已隐藏的检查器摘要（演示）'>复制摘要\u003c/button>\u003c/section>"},{"id":"suihuo","title":"燧火工作台","category":"扩展","description":"项目来源、制作状态与受控生成入口。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>从项目开始，保持画面一致\u003c/h1>\u003cp class='subtle'>燧火界面草案，不核验项目、不上传、不生成或付费。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='suihuo-assets'>素材库\u003c/button>\u003c/header>\u003csection class='card stack'>\u003cdiv class='cardhead'>\u003ch2>手机 / PC 界面设计项目\u003c/h2>\u003cspan class='badge'>来源待核验\u003c/span>\u003c/div>\u003clabel class='field'>项目\u003cselect>\u003coption>选择实际工作台项目\u003c/option>\u003coption>界面设计项目（占位示例）\u003c/option>\u003c/select>\u003c/label>\u003cp>本地设计目录不等于已核验的工作台项目。核实规则、风格、参考与当前版本后才能进入生产。\u003c/p>\u003cbutton type='button' class='btn primary' data-action='演示项目来源检查，不调用工作台'>检查项目来源\u003c/button>\u003c/section>\u003csection class='card'>\u003ch2>制作流程\u003c/h2>\u003col>\u003cli>核实项目权威来源。\u003c/li>\u003cli>检查页面规格、功能和参考职责。\u003c/li>\u003cli>预览本次任务与费用，取得 review_id。\u003c/li>\u003cli>用户授权后单次生成，完成逐图审查。\u003c/li>\u003c/ol>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn' data-action='预览生成门禁说明（演示，不提交）'>查看门禁\u003c/button>\u003cbutton type='button' class='btn' disabled>来源未核验，暂不可生成\u003c/button>\u003c/div>\u003c/section>\u003csection class='card'>\u003ch2>最近任务\u003c/h2>\u003cdiv class='empty-state'>\u003ch3>还没有可展示的生产任务\u003c/h3>\u003cp>此预览不会自动提交任务，也不把旧 HTML 截图记成燧火生成图。\u003c/p>\u003c/div>\u003c/section>"},{"id":"suihuo-assets","title":"燧火素材库","category":"扩展","description":"已定素材与未定候选分离，以及参考职责。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>素材有来源，参考有职责\u003c/h1>\u003cp class='subtle'>素材清单示例，不读取、上传或生成真实图片。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-route='suihuo'>返回项目\u003c/button>\u003c/header>\u003csection class='card stack'>\u003cdiv class='field-grid'>\u003clabel class='field'>素材范围\u003cselect>\u003coption>已定素材\u003c/option>\u003coption>未定候选\u003c/option>\u003coption>已停用旧稿\u003c/option>\u003c/select>\u003c/label>\u003clabel class='field'>搜索素材\u003cinput type='search' placeholder='名称、用途或页面 ID'>\u003c/label>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>规\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>页面功能规格\u003c/div>\u003cdiv class='row-desc'>职责：界面内容与真实动作约束 · 示例\u003c/div>\u003c/div>\u003cspan class='badge'>待绑定\u003c/span>\u003cbutton type='button' class='btn' data-action='查看素材职责（演示）'>详情\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>参\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>App 参考素材\u003c/div>\u003cdiv class='row-desc'>职责：布局与层级；来源、版本需核实\u003c/div>\u003c/div>\u003cspan class='pill'>候选\u003c/span>\u003cbutton type='button' class='btn' data-action='审查参考来源（演示）'>审查\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>旧\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>历史静态草图\u003c/div>\u003cdiv class='row-desc'>审计未通过 · 原位保留但不可施工\u003c/div>\u003c/div>\u003cspan class='pill'>已停用\u003c/span>\u003c/div>\u003c/section>\u003csection class='card'>\u003ch2>添加参考\u003c/h2>\u003cp>先明确参考用途及上传授权，再由受控工作台流程处理。\u003c/p>\u003cbutton type='button' class='btn' data-action='选择参考素材流程（演示，不打开文件或上传）'>了解添加流程\u003c/button>\u003c/section>"},{"id":"voice-settings","title":"语音设置","category":"扩展","description":"准备状态、设备、持续听写与声纹边界。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>说出来，也留得住\u003c/h1>\u003cp class='subtle'>语音设置演示，不开麦、不枚举设备、不下载模型。\u003c/p>\u003c/div>\u003cspan class='badge'>麦克风未开启\u003c/span>\u003c/header>\u003csection class='card stack'>\u003ch2>识别与设备\u003c/h2>\u003cdiv class='field-grid'>\u003clabel class='field'>识别提供商\u003cselect>\u003coption>本地识别提供商（示例）\u003c/option>\u003coption>跟随工作台选择\u003c/option>\u003c/select>\u003c/label>\u003clabel class='field'>麦克风\u003cselect>\u003coption>系统默认设备（未检测）\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='row-main'>\u003cdiv class='row-title'>识别资源尚未准备\u003c/div>\u003cdiv class='row-desc'>实际准备需要用户明确操作，进度与取消单独显示。\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-action='预览语音准备流程（演示，不下载）'>准备资源\u003c/button>\u003c/div>\u003clabel class='toggle'>\u003cinput type='checkbox' checked>持续听写模式（本页演示）\u003c/label>\u003cp>整句“发送”走普通输入提交；“帮我发送邮件”仍是正文。“取消”结束聆听并保留已插入草稿，不等于停止 Agent。\u003c/p>\u003c/section>\u003csection class='card stack'>\u003ch2>声纹过滤\u003c/h2>\u003clabel class='field'>匹配阈值\u003cinput type='number' min='0' max='1' step='0.01' value='0.55'>\u003c/label>\u003cp class='subtle'>声纹只用于听写过滤，不等于身份认证或审批授权。\u003c/p>\u003cdiv class='form-row'>\u003cbutton type='button' class='btn' data-action='预览声纹登记（演示，不录音）'>登记声纹\u003c/button>\u003cbutton type='button' class='btn' data-action='预览声纹测试（演示，不录音）'>测试\u003c/button>\u003cbutton type='button' class='btn danger' data-action='清除声纹确认（演示，不执行）'>清除\u003c/button>\u003c/div>\u003c/section>\u003csection class='card'>\u003ch2>听写与授权分开\u003c/h2>\u003cp>出现审批、提问或只读状态时暂停语音；迟到转写不能写入另一个会话。发送请求发出不等于 Host 已接纳。\u003c/p>\u003cbutton type='button' class='btn primary' data-action='保存语音偏好（演示）'>保存偏好\u003c/button>\u003c/section>"},{"id":"notifications","title":"通知与反馈","category":"工作台","description":"会话、后台任务与错误通知的归属和恢复。","body":"\u003cheader class='page-heading'>\u003cdiv>\u003ch1>重要的变化，清楚地到达\u003c/h1>\u003cp class='subtle'>通知清单演示，不读取系统通知或真实消息。\u003c/p>\u003c/div>\u003cbutton type='button' class='btn' data-action='标记通知已读（演示）'>全部标为已读\u003c/button>\u003c/header>\u003csection class='card stack'>\u003cdiv class='list-row'>\u003cdiv class='avatar'>?\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>一个问题等待你的回答\u003c/div>\u003cdiv class='row-desc'>属于演示会话 · 在原请求内回答，不能从通知直接代答。\u003c/div>\u003c/div>\u003cspan class='badge'>待处理\u003c/span>\u003cbutton type='button' class='btn' data-route='chat'>打开会话\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>✓\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>后台检查已结束\u003c/div>\u003cdiv class='row-desc'>查看退出状态与输出，不代表产品已验收。\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-route='job-detail'>查看结果\u003c/button>\u003c/div>\u003cdiv class='list-row'>\u003cdiv class='avatar'>!\u003c/div>\u003cdiv class='row-main'>\u003cdiv class='row-title'>配置保存冲突\u003c/div>\u003cdiv class='row-desc'>另一个页面已更新提供商配置，请核对后重试。\u003c/div>\u003c/div>\u003cbutton type='button' class='btn' data-route='provider-settings'>处理冲突\u003c/button>\u003c/div>\u003c/section>\u003csection class='card stack'>\u003ch2>消息反馈\u003c/h2>\u003clabel class='field'>反馈类型\u003cselect>\u003coption>界面问题\u003c/option>\u003coption>回答质量\u003c/option>\u003coption>工具结果\u003c/option>\u003c/select>\u003c/label>\u003clabel class='field'>补充说明\u003ctextarea rows='3' placeholder='描述遇到的问题，避免填写敏感凭据'>\u003c/textarea>\u003c/label>\u003cbutton type='button' class='btn primary' data-action='提交反馈（演示，不发送）'>提交反馈\u003c/button>\u003cp class='subtle'>失败时保留内容、允许重试；成功依据真实业务回执。\u003c/p>\u003c/section>"}],"legacy":[]}</script><script>
(()=>{'use strict';const data=JSON.parse(document.getElementById('page-data').textContent),pages=data.pages,map=new Map(pages.map(p=>[p.id,p]));const $=id=>document.getElementById(id),device=$('device');let route='home',mobile=false,dark=false,pressTimer,pressStart,pressedRow,openedAt=0,toastTimer,menuRow;

function show(id){if(!map.has(id))return;route=id;const p=map.get(id);location.hash=id;closeMenu();device.classList.remove('drawer-open','panel-open');$('sidebar').innerHTML=sidebar();$('app-header').innerHTML='<button class="icon-btn phone-menu" data-action="open-drawer" aria-label="打开导航">'+icon('menu',18)+'</button><div style="min-width:0"><div class="header-title">'+esc(p.title)+'</div><div class="header-subtitle">'+esc(p.category)+'</div></div><div class="header-actions"><button class="icon-btn desktop-only" data-action="分享预览" aria-label="分享">'+icon('branch',16)+'</button><button class="icon-btn" data-action="open-panel" aria-label="打开工作面板">'+icon('panel',17)+'</button><button class="icon-btn" data-action="页面操作" aria-label="更多操作">⋯</button></div>';$('app-body').classList.toggle('chat-page',composing.has(id)||['approval','questions','plan-review'].includes(id));$('page-body').innerHTML=stateView($('state-select').value)+(['loading','empty'].includes($('state-select').value)?'':p.body);$('composer-area').innerHTML=composer();const draft=$('draft');if(draft)draft.readOnly=['readonly','loading'].includes($('state-select').value);const send=$('composer-area').querySelector('.send');if(send)send.disabled=['readonly','loading','offline'].includes($('state-select').value);$('modal-layer').classList.remove('open');$('page-caption').textContent=String(pages.indexOf(p)+1).padStart(2,'0')+' / '+pages.length+' · '+p.title+' — '+p.description;device.dataset.state=$('state-select').value;for(const b of document.querySelectorAll('.catalog .page-link'))b.classList.toggle('active',b.dataset.route===id);if(p.scene){device.classList.add('drawer-open');if(p.scene==='session-menu')setTimeout(()=>{if(route===id)openRowMenu($('sidebar').querySelector('[data-session="s1"]'))},30)}if($('state-select').value==='readonly')for(const input of $('page-body').querySelectorAll('input,textarea,select,button[data-action]'))input.disabled=true;}

document.addEventListener('click',e=>{const nav=e.target.closest('[data-route]');if(nav){e.preventDefault();show(nav.dataset.route);catalog(false);return}const row=e.target.closest('[data-session]');const rowButton=e.target.closest('[data-row-menu]');if(rowButton){e.stopPropagation();openRowMenu(row);return}const item=e.target.closest('[data-session-action]');if(item){const action=item.dataset.sessionAction;closeMenu();if(action==='重命名'){modal('重命名会话','<p class="subtle">为会话设置一个容易找到的名称。</p><input class="field" id="rename-value" aria-label="会话名称" value="'+esc(menuRow.querySelector('.title').textContent)+'">','rename-demo')}else toast(action+' · 仅本地设计演示');return}const panel=e.target.closest('[data-panel]');if(panel){$('right-panel-content').innerHTML=map.get(panel.dataset.panel)?.body||'';return}const action=e.target.closest('[data-action]')?.dataset.action;if(action){if(action==='open-drawer')device.classList.add('drawer-open');else if(action==='open-panel'){device.classList.add('panel-open');$('right-panel-content').innerHTML=map.get('files')?.body||''}else if(action==='close-panel')device.classList.remove('panel-open');else if(action==='close-modal')$('modal-layer').classList.remove('open');else if(action==='rename-demo'){const value=$('rename-value').value.trim();if(value){menuRow.querySelector('.title').textContent=value;$('modal-layer').classList.remove('open');toast('会话名称已更新 · 演示')}}else if(action==='restore-preview'){$('state-select').value='normal';show(route)}else if(action==='send-demo'){const draft=$('draft');if(route==='running'){toast('已演示停止动作');return}if(!draft.value.trim()){toast('先写一点内容');return}const message=document.createElement('div');message.className='message user';message.textContent=draft.value;$('page-body').append(message);draft.value='';message.scrollIntoView?.({block:'nearest'});toast('消息仅显示在本地原型中')}else{toast(action+' · 设计演示，不执行真实业务')}return}if(e.target.closest('.sidebar-scrim'))device.classList.remove('drawer-open');if(row){if(Date.now()-
