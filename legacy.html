ckbox\"> 复杂动画\u003c/label>\u003c/fieldset>\u003cdiv class=\"card\">\u003clabel class=\"form-row\">03 · 还有什么约束？\u003ctextarea class=\"field\" rows=\"3\" placeholder=\"例如：手机操作菜单仅长按打开\">手机端不保留三个操作图标，长按后在会话行附近显示小菜单。\u003c/textarea>\u003c/label>\u003c/div>\u003cdiv class=\"cardhead\">\u003cbutton class=\"btn\" data-action=\"回答草稿已保留，尚未提交\">稍后回答\u003c/button>\u003cbutton class=\"btn primary\" data-action=\"演示：已提交这组回答\">提交回答 →\u003c/button>\u003c/div>\u003c/div>"},{"id":"plan-review","title":"审阅实施计划","category":"交互","description":"在实施前核对步骤、验证范围与边界，提供明确的批准和修订入口。","body":"\u003cdiv class=\"cardhead\">\u003cdiv>\u003ch1 class=\"page-heading\">设计系统迁移计划\u003c/h1>\u003cp class=\"subtle\">计划审阅 · 需要你的决定\u003c/p>\u003c/div>\u003cspan class=\"pill\">4 个阶段\u003c/span>\u003c/div>\u003cdiv class=\"card prose\" style=\"max-width:820px;margin:24px auto\">\u003ch2>统一视觉，保留现有功能链路\u003c/h2>\u003cp>先从共享组件开始，逐步覆盖页面，避免一次性替换所有状态管理。\u003c/p>\u003col class=\"stack\">\u003cli>\u003cstrong>建立基础规范\u003c/strong>\u003cp class=\"subtle\">主题变量、文字层级、间距与焦点状态。\u003c/p>\u003c/li>\u003cli>\u003cstrong>重绘组件\u003c/strong>\u003cp class=\"subtle\">按钮、表单、菜单、弹窗及消息卡片。\u003c/p>\u003c/li>\u003cli>\u003cstrong>接入业务视图\u003c/strong>\u003cp class=\"subtle\">导航、聊天、设置与右侧资源面板。\u003c/p>\u003c/li>\u003cli>\u003cstrong>验证完整流程\u003c/strong>\u003cp class=\"subtle\">手机键盘、长按、提交失败恢复与桌面分栏。\u003c/p>\u003c/li>\u003c/ol>\u003cdiv class=\"divider\">\u003c/div>\u003ch3>验收依据\u003c/h3>\u003cp>每个可点击动作都应有真实能力来源；无能力时显示明确状态，不以静态截图代替功能验证。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003clabel class=\"form-row\">需要调整的内容\u003ctextarea class=\"field\" rows=\"2\" placeholder=\"填写反馈后选择“修改计划”\">\u003c/textarea>\u003c/label>\u003cdiv class=\"cardhead\">\u003cbutton class=\"btn\" data-action=\"演示：计划反馈已交回修订\">修改计划\u003c/button>\u003cbutton class=\"btn primary\" data-action=\"演示：计划已批准\">批准并继续\u003c/button>\u003c/div>\u003c/div>"},{"id":"attachments","title":"附件与上传","category":"输入","description":"区分已就绪、上传中与失败附件，保留重试和移除入口。","body":"\u003ch1 class=\"page-heading\">把上下文一起带进来\u003c/h1>\u003cp class=\"subtle\">图片与文件按选择顺序排列。上传失败不会清空已经写好的消息。\u003c/p>\u003cdiv class=\"card\" style=\"border-style:dashed;text-align:center;padding:32px\">\u003cstrong>＋ 拖放文件到这里\u003c/strong>\u003cp class=\"subtle\">或选择本地文件；具体类型与大小限制由当前部署决定。\u003c/p>\u003cinput class=\"field\" type=\"file\" multiple aria-label=\"选择演示附件\">\u003c/div>\u003cdiv class=\"stack\" style=\"margin-top:20px\">\u003cdiv class=\"list-row card\">\u003cspan class=\"avatar\">▧\u003c/span>\u003cdiv class=\"row-main\">\u003cstrong class=\"row-title\">wireframe.png\u003c/strong>\u003cspan class=\"row-desc\">图片 · 248 KB\u003c/span>\u003c/div>\u003cspan class=\"badge\">✓ 已就绪\u003c/span>\u003cbutton class=\"btn\" data-route=\"preview-image\">预览\u003c/button>\u003cbutton class=\"btn\" data-action=\"演示：移除图片草稿\">移除\u003c/button>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"cardhead\">\u003cstrong>requirements.pdf\u003c/strong>\u003cspan class=\"badge\">上传中 · 64%\u003c/span>\u003c/div>\u003cprogress class=\"progress\" max=\"100\" value=\"64\">64%\u003c/progress>\u003cp class=\"subtle\">1.8 MB / 2.8 MB \u003cbutton class=\"btn\" data-action=\"演示：取消当前上传\">取消\u003c/button>\u003c/p>\u003c/div>\u003cdiv class=\"list-row card\">\u003cspan class=\"avatar\">!\u003c/span>\u003cdiv class=\"row-main\">\u003cstrong>research.csv\u003c/strong>\u003cspan class=\"row-desc\">上传失败 · 网络连接中断\u003c/span>\u003c/div>\u003cbutton class=\"btn primary\" data-action=\"演示：重新上传失败文件\">重试\u003c/button>\u003cbutton class=\"btn\" data-action=\"演示：移除失败附件\">移除\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"composer\" style=\"margin-top:24px\">\u003ctextarea class=\"field\" rows=\"2\" placeholder=\"告诉我如何使用这些文件\">根据附件整理一份组件清单。\u003c/textarea>\u003cdiv class=\"cardhead\">\u003cspan class=\"subtle\">等待上传完成后可发送\u003c/span>\u003cbutton class=\"btn primary\" disabled>上传中…\u003c/button>\u003c/div>\u003c/div>"},{"id":"commands","title":"指令选择","category":"输入","description":"围绕正在输入的命令提供候选、说明和键盘提示。","body":"\u003ch1 class=\"page-heading\">指令，从输入处展开\u003c/h1>\u003cp class=\"subtle\">候选来自当前可用能力；选择命令后继续填写参数。\u003c/p>\u003cdiv style=\"max-width:740px;margin:35px auto\">\u003cdiv class=\"card\">\u003cinput class=\"field\" value=\"/\" aria-label=\"搜索指令\">\u003cdiv class=\"subtle\" style=\"margin:16px 0 8px\">常用指令\u003c/div>\u003cbutton class=\"list-row\" data-route=\"plan-review\" style=\"width:100%;text-align:left\">\u003cspan class=\"avatar\">≡\u003c/span>\u003cspan class=\"row-main\">\u003cstrong>/plan\u003c/strong>\u003cspan class=\"row-desc\">先整理方案，再开始实施\u003c/span>\u003c/span>\u003ckbd>↵\u003c/kbd>\u003c/button>\u003cbutton class=\"list-row\" data-route=\"models\" style=\"width:100%;text-align:left\">\u003cspan class=\"avatar\">◇\u003c/span>\u003cspan class=\"row-main\">\u003cstrong>/model\u003c/strong>\u003cspan class=\"row-desc\">选择当前会话使用的模型\u003c/span>\u003c/span>\u003c/button>\u003cbutton class=\"list-row\" data-route=\"skills\" style=\"width:100%;text-align:left\">\u003cspan class=\"avatar\">✳\u003c/span>\u003cspan class=\"row-main\">\u003cstrong>/skill\u003c/strong>\u003cspan class=\"row-desc\">按需加载可用技能\u003c/span>\u003c/span>\u003c/button>\u003cdiv class=\"divider\">\u003c/div>\u003cspan class=\"subtle\">↑ ↓ 选择　↵ 应用　Esc 关闭\u003c/span>\u003c/div>\u003cdiv class=\"composer\" style=\"margin-top:16px\">\u003cspan class=\"pill\">/plan ×\u003c/span>\u003ctextarea class=\"field\" rows=\"2\" placeholder=\"描述你希望规划的目标\">\u003c/textarea>\u003cdiv class=\"cardhead\">\u003cspan class=\"subtle\">命令模式 · 参数尚未提交\u003c/span>\u003cbutton class=\"btn primary\" data-action=\"演示：提交计划命令\">执行命令 ↑\u003c/button>\u003c/div>\u003c/div>\u003c/div>"},{"id":"references","title":"引用文件与会话","category":"输入","description":"在输入中插入结构化引用，保留来源、路径和候选类型。","body":"\u003ch1 class=\"page-heading\">让讨论有据可依\u003c/h1>\u003cp class=\"subtle\">输入 @ 搜索文件或会话。引用卡片与普通文字共同组成草稿。\u003c/p>\u003cdiv class=\"card\" style=\"max-width:760px;margin:26px auto\">\u003cinput class=\"field\" value=\"@button\" aria-label=\"搜索引用\">\u003cdiv class=\"cardhead\" style=\"margin-top:18px\">\u003cstrong>文件\u003c/strong>\u003cspan class=\"badge\">当前工作区\u003c/span>\u003c/div>\u003cbutton class=\"list-row\" data-action=\"演示：插入Button文件引用\" style=\"width:100%;text-align:left\">\u003cspan class=\"avatar\">⌘\u003c/span>\u003cspan class=\"row-main\">\u003cstrong>Button.tsx\u003c/strong>\u003cspan class=\"row-desc\">src/components/Button.tsx\u003c/span>\u003c/span>\u003ckbd>↵\u003c/kbd>\u003c/button>\u003cbutton class=\"list-row\" data-action=\"演示：插入按钮样式引用\" style=\"width:100%;text-align:left\">\u003cspan class=\"avatar\">#\u003c/span>\u003cspan class=\"row-main\">\u003cstrong>Button.module.css\u003c/strong>\u003cspan class=\"row-desc\">src/components/Button.module.css\u003c/span>\u003c/span>\u003c/button>\u003cdiv class=\"divider\">\u003c/div>\u003cstrong>会话\u003c/strong>\u003cbutton class=\"list-row\" data-action=\"演示：插入会话引用\" style=\"width:100%;text-align:left\">\u003cspan class=\"avatar\">◌\u003c/span>\u003cspan class=\"row-main\">\u003cstrong>按钮交互规范\u003c/strong>\u003cspan class=\"row-desc\">northstar · 昨天\u003c/span>\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"composer\">\u003cp>请检查 \u003cbutton class=\"pill\" data-route=\"preview-document\">⌘ Button.tsx\u003c/button>，并参考 \u003cbutton class=\"pill\" data-route=\"chat\">◌ 按钮交互规范\u003c/button>。\u003c/p>\u003cdiv class=\"cardhead\">\u003cspan class=\"subtle\">引用保持独立，可预览或移除\u003c/span>\u003cbutton class=\"btn primary\" data-action=\"演示：发送包含引用的消息\">发送 ↑\u003c/button>\u003c/div>\u003c/div>"},{"id":"queue","title":"待处理消息","category":"运行","description":"区分发送中回显与已进入队列的消息，提供编辑、移除和插话。","body":"\u003cdiv class=\"cardhead\">\u003cdiv>\u003ch1 class=\"page-heading\">接下来处理\u003c/h1>\u003cp class=\"subtle\">当前轮次继续运行，队列消息会依次开始。\u003c/p>\u003c/div>\u003cspan class=\"badge\">2 条待处理\u003c/span>\u003c/div>\u003cdiv class=\"stack\" style=\"margin-top:24px\">\u003cdiv class=\"card\">\u003cdiv class=\"cardhead\">\u003cspan class=\"pill\">01 · 已排队\u003c/span>\u003cspan class=\"subtle\">14:34\u003c/span>\u003c/div>\u003cp>按钮完成后，把输入框的错误状态也补上。\u003c/p>\u003cdiv>\u003cbutton class=\"btn\" data-action=\"演示：进入队列消息编辑\">编辑\u003c/button> \u003cbutton class=\"btn\" data-action=\"演示：移除此条队列消息\">移除\u003c/button> \u003cbutton class=\"btn primary\" data-action=\"演示：将此条消息插入当前轮次\">现在插话 ↗\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"cardhead\">\u003cspan class=\"pill\">02 · 正在编辑\u003c/span>\u003cspan class=\"subtle\">尚未保存\u003c/span>\u003c/div>\u003ctextarea class=\"field\" rows=\"2\">最后补一份手机端交互验收清单。\u003c/textarea>\u003cdiv class=\"cardhead\" style=\"margin-top:12px\">\u003cbutton class=\"btn\" data-action=\"演示：取消编辑并保留原消息\">取消\u003c/button>\u003cbutton class=\"btn primary\" data-action=\"演示：保存队列消息编辑\">保存更改\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"opacity:.65\">\u003cspan class=\"badge\">发送中…\u003c/span>\u003cp>请保留暗色模式。\u003c/p>\u003cp class=\"subtle\">等待 Host 队列记录到达后，才启用编辑与插话。\u003c/p>\u003cbutton class=\"btn\" disabled>编辑\u003c/button> \u003cbutton class=\"btn\" disabled>移除\u003c/button>\u003c/div>\u003c/div>"},{"id":"tools","title":"工具调用详情","category":"运行","description":"命令、输入输出、状态和相关文件在一张可展开记录中。","body":"\u003cdiv class=\"cardhead\">\u003cdiv>\u003ch1 class=\"page-heading\">工具执行记录\u003c/h1>\u003cp class=\"subtle\">本轮 4 次调用 · 演示数据\u003c/p>\u003c/div>\u003cbutton class=\"btn\" data-route=\"trajectory\">查看轨迹\u003c/button>\u003c/div>\u003cdetails class=\"tool-card\" open>\u003csummary>\u003cstrong>✓ Shell · 验证组件\u003c/strong> \u003cspan class=\"subtle\">1.2 秒\u003c/span>\u003c/summary>\u003cdiv class=\"cardhead\" style=\"margin:16px 0\">\u003cspan class=\"pill\">工作目录 /workspace/northstar\u003c/span>\u003cspan class=\"badge\">退出码 0\u003c/span>\u003c/div>\u003cpre class=\"code\">\u003ccode>$ pnpm test -- Button\n\nPASS  src/components/Button.test.tsx\n  ✓ renders all variants\n  ✓ preserves focus on keyboard activation\n  ✓ disables action while loading\n\nTests: 3 passed, 3 total\u003c/code>\u003c/pre>\u003cbutton class=\"btn\" data-action=\"演示：复制工具输出\">复制输出\u003c/button>\u003c/details>\u003cdetails class=\"tool-card\">\u003csummary>✓ 读取 · Button.tsx \u003cspan class=\"subtle\">124 行\u003c/span>\u003c/summary>\u003cpre class=\"code\">src/components/Button.tsx\n读取范围 1–124\u003c/pre>\u003cbutton class=\"btn\" data-route=\"preview-document\">打开文件\u003c/button>\u003c/details>\u003cdetails class=\"tool-card\">\u003csummary>✓ 修改 · Button.module.css \u003cspan class=\"subtle\">+18 −6\u003c/span>\u003c/summary>\u003cbutton class=\"btn\" data-route=\"diff\">查看变更\u003c/button>\u003c/details>\u003cdetails class=\"tool-card\">\u003csummary>! 网络检索 · 暂时失败\u003c/summary>\u003cp>外部服务未响应。失败记录保留在当前轮次中。\u003c/p>\u003cbutton class=\"btn\" data-action=\"演示：展开工具失败详情\">错误详情\u003c/button>\u003c/details>"},{"id":"workflow","title":"工作流执行","category":"运行","description":"以阶段和成员展示工作流状态，并可进入关联会话。","body":"\u003cdiv class=\"cardhead\">\u003cdiv>\u003ch1 class=\"page-heading\">组件审查工作流\u003c/h1>\u003cp class=\"subtle\">workflow-run · 本轮执行记录\u003c/p>\u003c/div>\u003cspan class=\"badge\">● 运行中\u003c/span>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"cardhead\">\u003cstrong>已完成 2 / 3 个阶段\u003c/strong>\u003cspan class=\"subtle\">演示执行\u003c/span>\u003c/div>\u003cprogress class=\"progress\" max=\"3\" value=\"2\">2/3\u003c/progress>\u003c/div>\u003cdiv class=\"stack\" style=\"margin-top:20px\">\u003cdiv class=\"card\">\u003cspan class=\"badge\">✓ 阶段一\u003c/span>\u003ch3>盘点组件\u003c/h3>\u003cdiv class=\"list-row\">\u003cspan class=\"avatar\">A\u003c/span>\u003cspan class=\"row-main\">组件目录分析\u003cspan class=\"row-desc\">完成 · 已识别共享入口\u003c/span>\u003c/span>\u003cbutton class=\"btn\" data-route=\"subagents\">查看会话 ↗\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cspan class=\"badge\">✓ 阶段二\u003c/span>\u003ch3>检查一致性\u003c/h3>\u003cp class=\"subtle\">成员已完成按钮、表单与弹层的独立检查。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cspan class=\"badge\">◉ 阶段三\u003c/span>\u003ch3>汇总修改建议\u003c/h3>\u003cdiv class=\"list-row\">\u003cspan class=\"avatar\">B\u003c/span>\u003cspan class=\"row-main\">审查汇总\u003cspan class=\"row-desc\">正在生成结论\u003c/span>\u003c/span>\u003cbutton class=\"btn\" data-route=\"chat\">打开关联会话\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"subtle\">这里呈现运行、阶段与成员状态；详细结果在各自会话中查看。\u003c/p>"},{"id":"skills","title":"技能与预设","category":"运行","description":"按需发现技能、查看用途，并区分能力说明与实际加载。","body":"\u003cdiv class=\"cardhead\">\u003cdiv>\u003ch1 class=\"page-heading\">让合适的能力参与\u003c/h1>\u003cp class=\"subtle\">按任务加载技能，避免把全部说明塞进每次会话。\u003c/p>\u003c/div>\u003cbutton class=\"btn\" data-route=\"plugins\">管理能力\u003c/button>\u003c/div>\u003cinput class=\"field\" type=\"search\" placeholder=\"搜索技能名称或用途\">\u003cdiv class=\"stack\" style=\"margin-top:20px\">\u003carticle class=\"card\">\u003cdiv class=\"cardhead\">\u003cspan class=\"pill\">开发\u003c/span>\u003cspan class=\"badge\">本会话已加载\u003c/span>\u003c/div>\u003ch3>Cordis 插件开发\u003c/h3>\u003cp class=\"subtle\">检查公开契约，选择可维护的扩展入口，连接服务并验证用户操作。\u003c/p>\u003cbutton class=\"btn\" data-route=\"preview-document\">查看技能说明 ↗\u003c/button>\u003c/article>\u003carticle class=\"card\">\u003cspan class=\"pill\">创作\u003c/span>\u003ch3>图片与视频提示词\u003c/h3>\u003cp class=\"subtle\">按项目来源组织画面、动作、参考职责，并在生成前完成审查。\u003c/p>\u003cbutton class=\"btn\" data-action=\"演示：将技能需求加入草稿\">在会话中使用\u003c/button>\u003c/article>\u003c/div>\u003cdiv class=\"card\" style=\"margin-top:24px\">\u003cdiv class=\"cardhead\">\u003cdiv>\u003cstrong>当前 Agent 预设\u003c/strong>\u003cp class=\"subtle\">通用开发 · 当前配置说明\u003c/p>\u003c/div>\u003cbutton class=\"btn\" data-action=\"演示：打开预设选择\">选择预设 ⌄\u003c/button>\u003c/div>\u003cpre class=\"code\">name: general-development\ndescription: 理解项目、实施修改并验证结果\u003c/pre>\u003cp class=\"subtle\">配置查看为只读；创建或更新通过专门流程完成。\u003c/p>\u003c/div>"},{"id":"subagents","title":"子代理会话","category":"运行","description":"显示来源关系和独立状态，保留进入子会话与返回主会话入口。","body":"\u003cdiv class=\"cardhead\">\u003cdiv>\u003ch1 class=\"page-heading\">共同推进这
